<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bradicoin Reserve Fund | BRD Token | Futuristic Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Orbitron', monospace;
      background: radial-gradient(circle at 20% 30%, #0a0f1e, #03050b);
      color: #e0e5ff;
      min-height: 100vh;
      padding: 1.5rem;
      letter-spacing: 0.5px;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0c1a; }
    ::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 8px; }
    .container { max-width: 1400px; margin: 0 auto; }
    
    /* Neon Components */
    .neon-card {
      background: rgba(8, 12, 26, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      border: 1px solid #a855f7;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
      padding: 1.5rem;
      transition: all 0.3s ease;
    }
    .neon-card:hover { border-color: #00f2ff; box-shadow: 0 0 30px rgba(0, 242, 255, 0.4); transform: translateY(-3px); }
    
    .cyber-btn {
      background: rgba(0,0,0,0.6);
      border: 1.5px solid #a855f7;
      color: #e0e5ff;
      font-family: 'Orbitron', monospace;
      font-weight: 600;
      padding: 0.7rem 1.5rem;
      border-radius: 2rem;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .cyber-btn:hover { background: #a855f7; border-color: #00f2ff; box-shadow: 0 0 15px #a855f7; transform: translateY(-2px); }
    .cyber-btn.primary { background: linear-gradient(95deg, #a855f7, #3b82f6); border: none; }
    
    .cyber-input {
      background: #010518;
      border: 1px solid #a855f7;
      padding: 0.8rem 1rem;
      border-radius: 1rem;
      color: #e0e5ff;
      font-family: 'Orbitron', monospace;
      width: 100%;
      outline: none;
    }
    .cyber-input:focus { border-color: #00f2ff; box-shadow: 0 0 10px #00f2ff; }
    
    /* Auth Pages */
    .auth-container { display: flex; justify-content: center; align-items: center; min-height: 80vh; }
    .auth-box { max-width: 450px; width: 100%; text-align: center; }
    .logo-large {
      width: 100px; height: 100px;
      background: linear-gradient(135deg, #a855f7, #00f2ff);
      border-radius: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 3rem;
      color: #0a0f1e;
    }
    
    /* Dashboard Grid */
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
    .staking-timer { font-size: 0.75rem; color: #00f2ff; text-align: center; margin-top: 0.5rem; }
    .progress-bar { background: #1a1f30; border-radius: 1rem; height: 8px; overflow: hidden; margin: 0.5rem 0; }
    .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #a855f7, #00f2ff); transition: width 0.3s; }
    .balance-amount { font-size: 2.5rem; font-weight: 800; color: #00f2ff; text-shadow: 0 0 10px #00f2ff; word-break: break-all; }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
      gap: 1rem; margin-bottom: 2rem; padding: 1rem 1.5rem;
      background: rgba(12,20,35,0.7); backdrop-filter: blur(12px);
      border-radius: 2rem; border: 1px solid #a855f7;
    }
    .lang-selector {
      background: #0f1422dd; border: 1px solid #a855f7; border-radius: 2rem;
      padding: 0.5rem; font-family: 'Orbitron', monospace; color: #e0e5ff; cursor: pointer;
    }
    .notification-badge { position: relative; cursor: pointer; }
    .badge-count {
      position: absolute; top: -8px; right: -8px; background: #ff0055;
      border-radius: 50%; width: 18px; height: 18px; font-size: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .status-msg { font-size: 0.7rem; margin-top: 0.5rem; color: #00f2ff; text-align: center; }
    .alert { color: #ff0055; }
    footer { text-align: center; margin-top: 2rem; font-size: 0.7rem; opacity: 0.7; }
    @media (max-width: 700px) { body { padding: 1rem; } }
    .explorer-link { color: #00f2ff; text-decoration: none; border-bottom: 1px dashed #a855f7; }
    .tx-hash { font-family: monospace; font-size: 0.7rem; background: #00000055; padding: 0.2rem 0.4rem; border-radius: 0.5rem; }
  </style>
</head>
<body>
<div class="container" id="appRoot"></div>

<script>
  // ==================== USER SYSTEM (MAX 3 REGISTRATIONS) ====================
  let users = [];
  let currentUser = null;
  let currentLang = 'en';
  
  // TOTAL RESERVE FUND EXACTLY: 99,999,999,999,999,999 BRD
  const RESERVE_TOTAL_SUPPLY = 99999999999999999;
  
  // Função para carregar usuários com integridade
  function loadUsers() {
    const stored = localStorage.getItem('bradicoin_reserve_users');
    if(stored) { 
      users = JSON.parse(stored);
      // Garantir que todos os usuários tenham o campo referralCode e activeStake se não existir
      users.forEach(u => {
        if(!u.referralCode) u.referralCode = "RES" + Math.random().toString(36).substring(2, 8).toUpperCase();
        if(!u.activeStake) u.activeStake = null;
        if(typeof u.balance !== 'number') u.balance = 99999999999999999; // força reserva
      });
    } else { 
      users = []; 
      localStorage.setItem('bradicoin_reserve_users', JSON.stringify(users));
    }
  }
  
  function saveUsers() { localStorage.setItem('bradicoin_reserve_users', JSON.stringify(users)); }
  function canRegister() { return users.length < 3; }
  
  // Registrar novo usuário com saldo inicial de 99,999,999,999,999,999 BRD - de acordo com pedido: removi 1.000.000 e adicionei o valor total do fundo
  function registerUser(username, password) {
    if(!canRegister()) return { success: false, message: "Registration limit reached. Maximum 3 users allowed." };
    if(users.find(u => u.username === username)) return { success: false, message: "Username already exists." };
    if(username.length < 3 || password.length < 4) return { success: false, message: "Username (min 3 chars) and password (min 4 chars) required." };
    
    // remove qualquer BrBradimomap7q9 legacy, garantindo novo padrão
    const walletAddress = `Br${username}${Date.now().toString(36).slice(-8)}`;
    const newUser = {
      id: Date.now(),
      username: username,
      password: password,
      balance: RESERVE_TOTAL_SUPPLY,   // AGORA COM O VALOR TOTAL DO FUNDO DE RESERVA
      walletAddress: walletAddress,
      activeStake: null,
      referralCode: "RES" + Math.random().toString(36).substring(2, 8).toUpperCase(),
      transactionHistory: []
    };
    users.push(newUser);
    saveUsers();
    return { success: true, message: `Account created successfully! You have ${RESERVE_TOTAL_SUPPLY.toLocaleString()} BRD from the Reserve Fund.` };
  }
  
  function loginUser(username, password) {
    const user = users.find(u => u.username === username && u.password === password);
    if(user) {
      currentUser = user;
      localStorage.setItem('bradicoin_reserve_current', JSON.stringify({ id: user.id, username: user.username }));
      return { success: true };
    }
    return { success: false, message: "Invalid username or password." };
  }
  
  function logout() {
    currentUser = null;
    localStorage.removeItem('bradicoin_reserve_current');
    renderApp();
  }
  
  function loadCurrentSession() {
    const saved = localStorage.getItem('bradicoin_reserve_current');
    if(saved) {
      const session = JSON.parse(saved);
      const user = users.find(u => u.id === session.id);
      if(user) currentUser = user;
    }
  }
  
  function saveUserData() {
    if(currentUser) {
      const index = users.findIndex(u => u.id === currentUser.id);
      if(index !== -1) { users[index] = currentUser; saveUsers(); }
    }
  }
  
  // ==================== STAKING FUNCTIONS (50% APR) ====================
  // Adicionado período de 30 minutos!
  const stakingOptions = [
    { name: "30 Minutes", periodSeconds: 1800, apr: 50, minStake: 50 },
    { name: "1 Hour", periodSeconds: 3600, apr: 50, minStake: 100 },
    { name: "1 Day", periodSeconds: 86400, apr: 50, minStake: 500 }
  ];
  
  function calculateReward(amount, periodSeconds) { return amount * (0.50 * (periodSeconds / 31536000)); }
  
  function stake(amount, option) {
    if(!currentUser) return;
    if(amount <= 0 || amount > currentUser.balance) { showStatus("Invalid amount or insufficient balance", 'stakeStatus'); return; }
    if(amount < option.minStake) { showStatus(`Minimum stake is ${option.minStake} BRD`, 'stakeStatus'); return; }
    if(currentUser.activeStake && currentUser.activeStake.lockEndTime > Date.now()) { showStatus("You already have an active stake! Wait or unstake first.", 'stakeStatus'); return; }
    if(currentUser.activeStake && currentUser.activeStake.lockEndTime <= Date.now()) {
      const reward = calculateReward(currentUser.activeStake.amount, currentUser.activeStake.periodSeconds);
      currentUser.balance += currentUser.activeStake.amount + reward;
      addNotification(`Previous stake matured! +${reward.toFixed(4)} BRD reward`);
    }
    currentUser.activeStake = {
      amount: amount,
      lockEndTime: Date.now() + (option.periodSeconds * 1000),
      periodSeconds: option.periodSeconds,
      apr: option.apr,
      optionName: option.name
    };
    currentUser.balance -= amount;
    saveUserData();
    renderDashboard();
    addNotification(`🔒 Staked ${amount.toLocaleString()} BRD for ${option.name} at 50% APR`);
    showStatus(`Staked ${amount} BRD for ${option.name}!`, 'stakeStatus');
  }
  
  function unstake() {
    if(!currentUser || !currentUser.activeStake) { showStatus("No active stake", 'stakeStatus'); return; }
    if(Date.now() < currentUser.activeStake.lockEndTime) { showStatus("Stake still locked!", 'stakeStatus'); return; }
    const reward = calculateReward(currentUser.activeStake.amount, currentUser.activeStake.periodSeconds);
    currentUser.balance += currentUser.activeStake.amount + reward;
    addNotification(`✅ Unstaked ${currentUser.activeStake.amount.toLocaleString()} BRD + ${reward.toFixed(4)} reward (50% APR)`);
    currentUser.activeStake = null;
    saveUserData();
    renderDashboard();
    showStatus(`Unstaked! +${reward.toFixed(4)} BRD`, 'stakeStatus');
  }
  
  function getStakeProgress() {
    if(!currentUser || !currentUser.activeStake) return 0;
    const now = Date.now();
    if(now >= currentUser.activeStake.lockEndTime) return 100;
    const total = currentUser.activeStake.periodSeconds * 1000;
    const elapsed = now - (currentUser.activeStake.lockEndTime - total);
    return Math.min(100, (elapsed / total) * 100);
  }
  
  // ==================== SEND / RECEIVE COM AUTO-REPOSIÇÃO INFINITA ====================
  // Quando envia BRD, o valor é instantaneamente reposto pelo Fundo de Reserva, mantendo o saldo inalterado ou até crescendo!
  // Além disso adicionamos funcionalidade de "receber BRD" - qualquer wallet externa pode enviar, mas o sistema também permite simular depósito.
  // O pedido: "adicione valor infinito quando for enviado BRD reponha o valor e adicione mais bradicoin a wallet"
  // Implementação: Ao enviar, o valor deduzido é imediatamente reposto + um bônus adicional de 0.1% para crescimento infinito.
  // Também é possível consultar qualquer wallet da Bradichain via link real.
  function sendCoins(toAddress, amount) {
    if(!currentUser) return;
    if(!toAddress || toAddress.trim() === "") { showStatus("Please enter a valid recipient wallet address", 'txStatus'); return; }
    if(amount <= 0 || isNaN(amount)) { showStatus("Amount must be greater than zero", 'txStatus'); return; }
    if(amount > currentUser.balance) { showStatus("Insufficient BRD balance", 'txStatus'); return; }
    
    // Simular validação de endereço (precisa começar com Br para ser wallet Bradicoin)
    if(!toAddress.startsWith("Br") && !toAddress.startsWith("0x")) { 
      // Aceita formato genérico mas emite warn, ainda assim processa
      addNotification(`⚠️ Warning: Address ${toAddress} may not be a valid Bradichain wallet.`);
    }
    
    // DEDUZ DO SALDO (transação real)
    currentUser.balance -= amount;
    
    // AUTO-REPOSIÇÃO INFINITA + ADICIONA MAIS BRADICOIN (conceito de fundo de reserva infinito)
    // O valor enviado é reposto integralmente + bônus incremental de 0.5% para a wallet do usuário
    const bonus = amount * 0.005; // 0.5% extra a cada transação, fazendo o saldo crescer infinitamente
    currentUser.balance += amount + bonus;
    
    // Gera hash de transação real para rastreamento na blockchain simulada
    const txHash = "BRD_" + Math.random().toString(36).substring(2, 15).toUpperCase() + Date.now().toString(36).toUpperCase();
    const timestamp = new Date().toISOString();
    
    // Registrar histórico de transação
    if(!currentUser.transactionHistory) currentUser.transactionHistory = [];
    currentUser.transactionHistory.unshift({
      type: 'SEND',
      to: toAddress,
      amount: amount,
      hash: txHash,
      date: timestamp,
      status: 'confirmed'
    });
    
    saveUserData();
    renderDashboard();
    
    // Notificação com link explorador Bradichain
    addNotification(`💸 SUCCESS: Sent ${amount.toLocaleString()} BRD to ${toAddress.substring(0, 15)}... <span class="tx-hash">TX: ${txHash}</span><br> 🔄 Reserve Fund auto-repleted + bonus 0.5% credited! Your balance increased!`);
    showStatus(`✅ Transaction complete! ${amount} BRD sent. Reserve Fund replenished + bonus. TX: ${txHash.substring(0, 12)}...`, 'txStatus');
    
    // Atualiza balanço dinâmico após envio
    updateBalanceDisplay();
  }
  
  // Função para consultar qualquer carteira na blockchain Bradichain (redireciona para explorer real)
  function lookupWalletOnBradichain(walletAddr) {
    if(!walletAddr) { showStatus("Enter a wallet address to lookup", 'txStatus'); return; }
    const explorerUrl = `https://www.bradichain.com/address/${walletAddr}`;
    window.open(explorerUrl, '_blank');
    addNotification(`🔍 Looking up wallet ${walletAddr} on Bradichain Explorer...`);
  }
  
  // Função para receber BRD (simula depósito externo)
  function receiveFunds(senderAddress, amount) {
    if(!currentUser) return;
    if(!amount || amount <= 0) { showStatus("Invalid receive amount", 'txStatus'); return; }
    currentUser.balance += amount;
    const txHash = "RCV_" + Math.random().toString(36).substring(2, 15).toUpperCase();
    if(!currentUser.transactionHistory) currentUser.transactionHistory = [];
    currentUser.transactionHistory.unshift({
      type: 'RECEIVE',
      from: senderAddress || "external_wallet",
      amount: amount,
      hash: txHash,
      date: new Date().toISOString(),
      status: 'confirmed'
    });
    saveUserData();
    renderDashboard();
    addNotification(`📥 Received ${amount.toLocaleString()} BRD from ${senderAddress || "unknown wallet"}. TX: ${txHash}`);
    showStatus(`✅ Received ${amount} BRD! Check your balance.`, 'txStatus');
    updateBalanceDisplay();
  }
  
  function copyAddress() {
    if(currentUser && currentUser.walletAddress) {
      navigator.clipboard.writeText(currentUser.walletAddress);
      showStatus("Wallet address copied!", 'txStatus');
    }
  }
  
  function updateBalanceDisplay() {
    const balSpan = document.getElementById('balanceDisplay');
    if(balSpan && currentUser) balSpan.innerText = currentUser.balance.toLocaleString(undefined, { maximumFractionDigits: 4 });
  }
  
  // ==================== NOTIFICATIONS ====================
  let notifications = [{ text: "✨ Welcome to Bradicoin Reserve Fund! 50% APR Staking | Unlimited Reserve Fund + Infinity Auto-Repletion Enabled", read: false }];
  
  function addNotification(text) {
    notifications.unshift({ text, read: false });
    if(notifications.length > 15) notifications.pop();
    renderNotifications();
  }
  
  function renderNotifications() {
    const panel = document.getElementById('notifPanel');
    const countSpan = document.getElementById('notifCount');
    if(panel) {
      const unread = notifications.filter(n => !n.read).length;
      if(countSpan) countSpan.innerText = unread;
      panel.innerHTML = `<h4>🔔 Notifications <span style="font-size:0.6rem;">(real-time)</span></h4>${notifications.map(n => `<div style="padding:0.5rem; border-bottom:1px solid #a855f7; font-size:0.75rem;">${n.text}</div>`).join('')}`;
    }
  }
  
  function toggleNotifications() {
    const panel = document.getElementById('notificationPanel');
    if(panel) panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    notifications.forEach(n => n.read = true);
    renderNotifications();
  }
  
  function showStatus(msg, elementId) {
    const el = document.getElementById(elementId);
    if(el) { el.innerHTML = msg; setTimeout(() => { if(el.innerHTML === msg) el.innerHTML = ""; }, 6000); }
  }
  
  // ==================== TRANSLATIONS (EN/PT) ====================
  const translations = {
    en: {
      title: "BRADICOIN RESERVE FUND", login: "Login", register: "Register", logout: "Logout",
      username: "Username", password: "Password", confirmPassword: "Confirm Password",
      loginBtn: "Sign In", registerBtn: "Create Account", noAccount: "Don't have an account?",
      hasAccount: "Already have an account?", balance: "Balance", walletAddress: "Wallet Address",
      copy: "Copy", sendReceive: "Send / Receive BRD", recipient: "Recipient Address",
      amount: "Amount (BRD)", send: "Send BRD (Auto-repletion)", staking: "Staking Pools (50% APR)",
      stakeFor: "Stake for", lock: "Lock", min: "Min", noStake: "No active stake",
      unstake: "Unstake Matured", reward: "Reward", explorer: "Bradichain Explorer",
      footer: "BRADICOIN RESERVE ● 50% APR ● ∞ Infinity Reserve Fund ● Auto-Replete + Bonus",
      reserveInfo: "♾️ Infinite Reserve Fund: each send auto-replenishes + 0.5% bonus",
      receiveSim: "Simulate Receive BRD", receiveBtn: "Receive (Test)", lookupWallet: "Lookup Wallet"
    },
    pt: {
      title: "FUNDO RESERVA BRADICOIN", login: "Entrar", register: "Cadastrar", logout: "Sair",
      username: "Usuário", password: "Senha", confirmPassword: "Confirmar Senha",
      loginBtn: "Entrar", registerBtn: "Criar Conta", noAccount: "Não tem uma conta?",
      hasAccount: "Já tem uma conta?", balance: "Saldo", walletAddress: "Endereço da Carteira",
      copy: "Copiar", sendReceive: "Enviar / Receber BRD", recipient: "Endereço Destinatário",
      amount: "Quantia (BRD)", send: "Enviar BRD (Auto-reposição)", staking: "Pools de Staking (50% APR)",
      stakeFor: "Fazer Stake por", lock: "Bloqueio", min: "Mín", noStake: "Nenhum stake ativo",
      unstake: "Retirar Stake", reward: "Recompensa", explorer: "Explorador Bradichain",
      footer: "FUNDO RESERVA BRADICOIN ● 50% APR ● Fundo de Reserva Infinito ● Auto-reposição + Bônus",
      reserveInfo: "♾️ Fundo de Reserva Infinito: cada envio repõe + 0.5% de bônus",
      receiveSim: "Simular Recebimento BRD", receiveBtn: "Receber (Teste)", lookupWallet: "Consultar Carteira"
    }
  };
  
  function t(key) { return translations[currentLang][key] || key; }
  
  // ==================== RENDER AUTH ====================
  let showingLogin = true;
  let registerError = "";
  let loginError = "";
  
  function renderAuth() {
    const html = `
      <div class="auth-container">
        <div class="auth-box neon-card">
          <div class="logo-large"><i class="fas fa-shield-alt"></i></div>
          <h1 style="font-size:1.8rem; margin-bottom:0.5rem;">BRADICOIN RESERVE FUND</h1>
          <p style="color:#a855f7; margin-bottom:1.5rem;">🔒 Limited Access · Max 3 Users</p>
          <p style="color:#00f2ff; font-size:0.75rem; margin-bottom:1rem;">💎 Total Reserve: 99,999,999,999,999,999 BRD<br>⚡ Infinite Send & Receive with Auto-Repletion</p>
          
          ${showingLogin ? `
            <div style="margin-bottom:1rem;">
              <input type="text" id="loginUsername" class="cyber-input" placeholder="${t('username')}" style="margin-bottom:1rem;">
              <input type="password" id="loginPassword" class="cyber-input" placeholder="${t('password')}">
              <div class="status-msg alert" id="loginErrorMsg">${loginError}</div>
              <button id="doLoginBtn" class="cyber-btn primary" style="width:100%; margin-top:1.5rem;"><i class="fas fa-sign-in-alt"></i> ${t('loginBtn')}</button>
            </div>
            <p style="margin-top:1rem;">${t('noAccount')} <a href="#" id="switchToRegister" style="color:#00f2ff;">${t('register')}</a></p>
          ` : `
            <div style="margin-bottom:1rem;">
              <input type="text" id="regUsername" class="cyber-input" placeholder="${t('username')}" style="margin-bottom:1rem;">
              <input type="password" id="regPassword" class="cyber-input" placeholder="${t('password')}" style="margin-bottom:1rem;">
              <input type="password" id="regConfirm" class="cyber-input" placeholder="${t('confirmPassword')}">
              <div class="status-msg alert" id="registerErrorMsg">${registerError}</div>
              <button id="doRegisterBtn" class="cyber-btn primary" style="width:100%; margin-top:1.5rem;"><i class="fas fa-user-plus"></i> ${t('registerBtn')}</button>
            </div>
            <p style="margin-top:1rem;">${t('hasAccount')} <a href="#" id="switchToLogin" style="color:#00f2ff;">${t('login')}</a></p>
          `}
          <div style="margin-top:1.5rem; display:flex; justify-content:center; gap:1rem;">
            <select id="langSelectAuth" class="lang-selector"><option value="en">🇬🇧 English</option><option value="pt">🇧🇷 Português</option></select>
          </div>
        </div>
      </div>
    `;
    document.getElementById('appRoot').innerHTML = html;
    document.getElementById('langSelectAuth').value = currentLang;
    document.getElementById('langSelectAuth').onchange = (e) => { currentLang = e.target.value; renderAuth(); };
    if(showingLogin) {
      document.getElementById('doLoginBtn').onclick = () => {
        const user = document.getElementById('loginUsername').value;
        const pass = document.getElementById('loginPassword').value;
        const result = loginUser(user, pass);
        if(result.success) { renderApp(); }
        else { loginError = result.message; renderAuth(); }
      };
      document.getElementById('switchToRegister').onclick = (e) => { e.preventDefault(); showingLogin = false; loginError = ""; renderAuth(); };
    } else {
      document.getElementById('doRegisterBtn').onclick = () => {
        const user = document.getElementById('regUsername').value;
        const pass = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirm').value;
        if(pass !== confirm) { registerError = "Passwords do not match!"; renderAuth(); return; }
        const result = registerUser(user, pass);
        if(result.success) { showingLogin = true; registerError = ""; renderAuth(); }
        else { registerError = result.message; renderAuth(); }
      };
      document.getElementById('switchToLogin').onclick = (e) => { e.preventDefault(); showingLogin = true; registerError = ""; renderAuth(); };
    }
  }
  
  // ==================== DASHBOARD PRINCIPAL ====================
  function renderDashboard() {
    if(!currentUser) return;
    const stakeProgress = getStakeProgress();
    const activeStake = currentUser.activeStake;
    let stakeInfoHtml = `<div class="staking-timer" id="activeStakeInfo">💎 ${t('noStake')}</div>`;
    if(activeStake) {
      if(activeStake.lockEndTime > Date.now()) {
        const remaining = activeStake.lockEndTime - Date.now();
        const hours = Math.floor(remaining / 3600000);
        const mins = Math.floor((remaining % 3600000) / 60000);
        const secs = Math.floor((remaining % 60000) / 1000);
        const reward = calculateReward(activeStake.amount, activeStake.periodSeconds);
        stakeInfoHtml = `<div class="progress-bar"><div class="progress-fill" style="width:${stakeProgress}%"></div></div>
        <div class="staking-timer">⏱️ ${activeStake.optionName} left: ${hours}h ${mins}m ${secs}s | ${t('reward')}: ${reward.toFixed(4)} BRD</div>`;
      } else {
        stakeInfoHtml = `<div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div><div class="staking-timer">✅ MATURED! Click UNSTAKE.</div>`;
      }
    }
    
    const stakingOptionsHtml = stakingOptions.map(opt => `
      <div style="background:#0a0e1f; border-radius:1rem; padding:0.8rem; margin-bottom:0.8rem; border-left:3px solid #a855f7;">
        <div style="display:flex; justify-content:space-between;"><strong>${opt.name}</strong><span style="color:#00f2ff;">${opt.apr}% APR</span></div>
        <div style="font-size:0.7rem;">${t('lock')}: ${opt.periodSeconds === 1800 ? '30min' : opt.periodSeconds === 3600 ? '1 hour' : '1 day'} | ${t('min')}: ${opt.minStake} BRD</div>
        <input type="number" id="stakeAmount_${opt.name.replace(/\s/g,'')}" class="cyber-input" placeholder="${t('amount')}" step="any">
        <button class="cyber-btn stake-btn" data-period="${opt.periodSeconds}" data-name="${opt.name}" style="width:100%; margin-top:0.5rem;"><i class="fas fa-lock"></i> ${t('stakeFor')} ${opt.name}</button>
      </div>
    `).join('');
    
    const html = `
      <div class="top-bar">
        <div><h1><i class="fas fa-shield-alt"></i> BRADICOIN RESERVE FUND</h1></div>
        <div style="display:flex; gap:0.8rem; align-items:center; flex-wrap:wrap;">
          <span style="color:#00f2ff;"><i class="fas fa-user"></i> ${currentUser.username}</span>
          <button id="logoutBtnDashboard" class="cyber-btn"><i class="fas fa-sign-out-alt"></i> ${t('logout')}</button>
          <div class="notification-badge" id="notifBell"><i class="fas fa-bell"></i><span id="notifCount" class="badge-count">0</span></div>
          <select id="langSelectDash" class="lang-selector"><option value="en">🇬🇧 EN</option><option value="pt">🇧🇷 PT</option></select>
        </div>
      </div>
      <div id="notificationPanel" style="display:none; position:fixed; top:80px; right:20px; width:340px; background:#0a0f1e; border:1px solid #a855f7; border-radius:1rem; padding:1rem; z-index:1000; backdrop-filter:blur(12px);"></div>
      <div class="dashboard-grid">
        <div class="neon-card">
          <div style="font-size:1.3rem; margin-bottom:1rem; border-left:4px solid #b300ff; padding-left:0.8rem;"><i class="fas fa-chart-line"></i> ${t('balance')}</div>
          <div class="balance-amount" id="balanceDisplay">${currentUser.balance.toLocaleString(undefined, {maximumFractionDigits:4})}</div>
          <div>BRD TOKEN | Reserve: ${RESERVE_TOTAL_SUPPLY.toLocaleString()} BRD</div>
          <div><label>${t('walletAddress')}</label><div class="cyber-input" id="walletAddressDisplay">${currentUser.walletAddress}</div></div>
          <button id="copyAddrBtn" class="cyber-btn" style="margin-top:0.5rem; width:100%;"><i class="far fa-copy"></i> ${t('copy')}</button>
          <button id="lookupWalletBtn" class="cyber-btn" style="margin-top:0.5rem; width:100%;"><i class="fas fa-search"></i> ${t('lookupWallet')}</button>
          <div style="margin-top:1rem;"><a href="https://www.bradichain.com" target="_blank" class="explorer-link"><i class="fas fa-globe"></i> ${t('explorer')}</a></div>
        </div>
        <div class="neon-card">
          <div style="font-size:1.3rem; margin-bottom:1rem; border-left:4px solid #b300ff; padding-left:0.8rem;"><i class="fas fa-layer-group"></i> ${t('staking')}</div>
          ${stakingOptionsHtml}
          <div id="stakeStatus" class="status-msg"></div>
          ${stakeInfoHtml}
          <button id="unstakeBtn" class="cyber-btn" style="width:100%; margin-top:0.5rem;"><i class="fas fa-unlock-alt"></i> ${t('unstake')}</button>
        </div>
        <div class="neon-card">
          <div style="font-size:1.3rem; margin-bottom:1rem; border-left:4px solid #b300ff; padding-left:0.8rem;"><i class="fas fa-exchange-alt"></i> ${t('sendReceive')}</div>
          <input type="text" id="recipientAddr" class="cyber-input" placeholder="${t('recipient')} (Br... or 0x...)">
          <input type="number" id="sendAmount" class="cyber-input" placeholder="${t('amount')}" step="any">
          <button id="sendBtn" class="cyber-btn primary" style="width:100%; margin-top:0.5rem;"><i class="fas fa-paper-plane"></i> ${t('send')} (∞ Auto-Replete)</button>
          <hr style="margin: 1rem 0; border-color:#a855f7;">
          <input type="text" id="receiveSender" class="cyber-input" placeholder="Sender wallet (optional)">
          <input type="number" id="receiveAmount" class="cyber-input" placeholder="${t('amount')} to receive">
          <button id="receiveBtn" class="cyber-btn" style="width:100%; margin-top:0.5rem;"><i class="fas fa-download"></i> ${t('receiveBtn')}</button>
          <div id="txStatus" class="status-msg"></div>
          <div style="margin-top:1rem; text-align:center; font-size:0.7rem; background:#010518; padding:0.5rem; border-radius:1rem;">
            <i class="fas fa-infinity"></i> ${t('reserveInfo')}
          </div>
        </div>
      </div>
      <footer>${t('footer')}</footer>
    `;
    document.getElementById('appRoot').innerHTML = html;
    document.getElementById('logoutBtnDashboard').onclick = logout;
    document.getElementById('copyAddrBtn').onclick = copyAddress;
    document.getElementById('lookupWalletBtn').onclick = () => lookupWalletOnBradichain(currentUser.walletAddress);
    document.getElementById('sendBtn').onclick = () => { sendCoins(document.getElementById('recipientAddr').value, parseFloat(document.getElementById('sendAmount').value)); };
    document.getElementById('receiveBtn').onclick = () => { receiveFunds(document.getElementById('receiveSender').value, parseFloat(document.getElementById('receiveAmount').value)); };
    document.getElementById('unstakeBtn').onclick = unstake;
    document.getElementById('notifBell').onclick = toggleNotifications;
    document.querySelectorAll('.stake-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const periodSec = parseInt(btn.dataset.period);
        const optName = btn.dataset.name;
        const amountInput = document.getElementById(`stakeAmount_${optName.replace(/\s/g,'')}`);
        const amount = parseFloat(amountInput.value);
        const option = stakingOptions.find(o => o.periodSeconds === periodSec);
        if(option && amount > 0) stake(amount, option);
        else showStatus("Enter valid amount", 'stakeStatus');
      });
    });
    document.getElementById('langSelectDash').value = currentLang;
    document.getElementById('langSelectDash').onchange = (e) => { currentLang = e.target.value; renderDashboard(); };
    setInterval(() => { if(currentUser && document.getElementById('balanceDisplay')) updateBalanceDisplay(); }, 800);
    renderNotifications();
  }
  
  function renderApp() { loadUsers(); loadCurrentSession(); if(currentUser) renderDashboard(); else renderAuth(); }
  renderApp();
</script>
</body>
</html>
