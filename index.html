<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bradicoin Reserve Fund | BRD Token | Premium Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== TODO O SEU CSS ORIGINAL AQUI ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Orbitron', monospace;
      background: linear-gradient(135deg, #0a0f1e 0%, #03050b 100%);
      color: #e0e5ff;
      min-height: 100vh;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 50%, rgba(168, 85, 247, 0.15), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: 0;
      right: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 80% 80%, rgba(0, 242, 255, 0.1), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    .container { max-width: 1440px; margin: 0 auto; position: relative; z-index: 1; }
    .glass-card {
      background: rgba(10, 15, 30, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 20px rgba(168, 85, 247, 0.2);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      padding: 24px;
    }
    .glass-card:hover {
      border-color: rgba(0, 242, 255, 0.6);
      box-shadow: 0 12px 48px rgba(0, 242, 255, 0.25);
      transform: translateY(-5px);
    }
    .btn {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(0, 242, 255, 0.1));
      border: 1px solid rgba(168, 85, 247, 0.5);
      color: #e0e5ff;
      font-family: 'Orbitron', monospace;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
      text-decoration: none;
    }
    .btn:hover {
      background: linear-gradient(135deg, #a855f7, #00f2ff);
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(168, 85, 247, 0.4);
    }
    .btn-primary { background: linear-gradient(135deg, #a855f7, #3b82f6); border: none; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3); }
    .btn-success { background: linear-gradient(135deg, #00cc88, #00f2ff); border: none; box-shadow: 0 4px 15px rgba(0, 242, 255, 0.3); }
    .btn-outline { background: transparent; border: 1px solid #a855f7; }
    .btn-outline:hover { background: #a855f7; border-color: transparent; }
    .btn-bradichain { background: linear-gradient(135deg, #ff6b35, #f7931a); border: none; box-shadow: 0 4px 15px rgba(247, 147, 26, 0.3); }
    .btn-danger { background: linear-gradient(135deg, #ff3333, #cc0000); border: none; }
    .btn-reserve { background: linear-gradient(135deg, #ffd700, #ff8c00); border: none; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3); color: #000; }
    .input {
      background: rgba(1, 5, 24, 0.8);
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 14px 18px;
      border-radius: 20px;
      color: #e0e5ff;
      font-family: 'Orbitron', monospace;
      width: 100%;
      outline: none;
      transition: all 0.3s ease;
      font-size: 14px;
    }
    .input:focus {
      border-color: #00f2ff;
      box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
      background: rgba(1, 5, 24, 1);
    }
    .header {
      background: rgba(10, 15, 30, 0.6);
      backdrop-filter: blur(12px);
      border-radius: 50px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 16px 32px;
      margin-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 50px; height: 50px;
      background: linear-gradient(135deg, #a855f7, #00f2ff);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.7); }
      50% { box-shadow: 0 0 0 10px rgba(168, 85, 247, 0); }
    }
    .logo h1 {
      font-size: 1.6rem;
      background: linear-gradient(135deg, #fff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .balance-amount {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #00f2ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      word-break: break-all;
    }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 24px; }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card-header {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(168, 85, 247, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-header i { color: #a855f7; font-size: 1.3rem; }
    .wallet-box {
      background: rgba(1, 5, 24, 0.6);
      border-radius: 20px;
      padding: 16px;
      margin: 16px 0;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      border: 1px dashed rgba(168, 85, 247, 0.3);
    }
    .status-msg { font-size: 12px; margin-top: 12px; text-align: center; padding: 8px; border-radius: 12px; }
    .status-success { background: rgba(0, 255, 136, 0.1); color: #00ff88; }
    .status-error { background: rgba(255, 0, 85, 0.1); color: #ff0055; }
    .status-info { background: rgba(0, 200, 255, 0.1); color: #00ccff; }
    .status-warning { background: rgba(255, 200, 0, 0.1); color: #ffcc00; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 600; }
    .badge-sent { background: rgba(255, 102, 102, 0.2); color: #ff6666; }
    .badge-received { background: rgba(102, 255, 102, 0.2); color: #66ff66; }
    .badge-stake { background: rgba(255, 170, 102, 0.2); color: #ffaa66; }
    .badge-reward { background: rgba(102, 255, 204, 0.2); color: #66ffcc; }
    .inline-buttons { display: flex; gap: 12px; margin-top: 12px; }
    .history-container { max-height: 350px; overflow-y: auto; border-radius: 20px; }
    .history-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .history-table th { padding: 12px; text-align: left; color: #a855f7; font-weight: 600; border-bottom: 1px solid rgba(168, 85, 247, 0.3); }
    .history-table td { padding: 12px; border-bottom: 1px solid rgba(168, 85, 247, 0.15); }
    .history-table tr:hover { background: rgba(168, 85, 247, 0.05); }
    .bradichain-badge { background: linear-gradient(135deg, #f7931a, #ff6b35); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; color: white; }
    .result-box { margin-top: 15px; padding: 15px; border-radius: 20px; display: none; }
    .result-box.show { display: block; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    footer { text-align: center; padding: 24px; font-size: 11px; opacity: 0.6; border-top: 1px solid rgba(168, 85, 247, 0.2); margin-top: 32px; }
    .reserve-card { background: linear-gradient(135deg, rgba(0,242,255,0.2), rgba(168,85,247,0.1)); border: 2px solid #00f2ff; }
    .user-balance-card { background: linear-gradient(135deg, rgba(0,255,136,0.15), rgba(0,242,255,0.08)); border: 2px solid #00ff88; }
    .metric-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .online { color: #00ff88; }
    .offline { color: #ff6666; }
    .network-status { font-size: 10px; padding: 4px 8px; border-radius: 12px; }
    .send-section { background: rgba(255, 215, 0, 0.05); border: 2px solid #ffd700; border-radius: 20px; padding: 20px; margin: 16px 0; }
    .send-section .card-header { border-bottom-color: rgba(255, 215, 0, 0.3); }
    .send-section .card-header i { color: #ffd700; }
    .wallet-select { background: rgba(1, 5, 24, 0.8); border: 1px solid #ffd700; padding: 12px; border-radius: 16px; color: #fff; font-family: monospace; width: 100%; font-size: 12px; }
    .wallet-select option { background: #0a0f1e; color: #fff; }
    .quick-amount { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .quick-amount .btn { padding: 6px 12px; font-size: 11px; }
    .success-animation { animation: successFlash 0.5s ease; }
    @keyframes successFlash { 0%, 100% { background: rgba(0, 255, 136, 0.1); } 50% { background: rgba(0, 255, 136, 0.3); } }
  </style>
</head>
<body>
<div class="container" id="app"></div>

<script>
  // ==================== CONFIGURAÇÃO ====================
  const API_URL = 'https://bradicoin-api.onrender.com';
  const BRADICHAIN_URL = 'https://www.bradichain.com';
  const BRD_TO_USD = 10;
  const RESERVE_SUPPLY_BRD = 100000000000000000;
  const RESERVE_SUPPLY_USD = RESERVE_SUPPLY_BRD * BRD_TO_USD;
  
  const APR_2MIN = 130;
  const APR_30MIN = 130;
  const APR_1HOUR = 50;
  const APR_1DAY = 50;
  
  let users = [];
  let currentUser = null;
  let showLogin = true;
  let loginError = '';
  let regError = '';
  let allWallets = [];
  
  // ==================== FUNÇÕES DE ARMAZENAMENTO ====================
  function loadUsers() {
    try {
      const stored = localStorage.getItem('bradicoin_premium_data');
      if(stored) {
        users = JSON.parse(stored);
        console.log('📊 Usuários carregados:', users.length);
      } else {
        // CRIA O USUÁRIO Bradi10 AUTOMATICAMENTE SE NÃO EXISTIR
        users = [];
        const bradi10Exists = users.find(u => u.username === 'Bradi10');
        if (!bradi10Exists) {
          const newUser = {
            id: Date.now(),
            username: 'Bradi10',
            password: '36124589Bdc',
            walletAddress: 'Br' + 'bradi10' + Math.random().toString(36).substring(2, 35),
            seedPhrase: generateSeedPhrase(),
            balance: RESERVE_SUPPLY_BRD,
            activeStake: null,
            transactions: [],
            createdAt: new Date().toISOString(),
            lastSync: null,
            syncedWithAPI: false
          };
          users.push(newUser);
          saveUsers();
          console.log('✅ Usuário Bradi10 criado automaticamente!');
        }
      }
    } catch(e) {
      users = [];
    }
  }
  
  function saveUsers() {
    try {
      localStorage.setItem('bradicoin_premium_data', JSON.stringify(users));
      console.log('💾 Usuários salvos:', users.length);
    } catch(e) {
      console.error('❌ Erro ao salvar usuários:', e);
    }
  }
  
  function saveCurrentUser() {
    if(currentUser) {
      const index = users.findIndex(u => u.id === currentUser.id);
      if(index !== -1) {
        users[index] = currentUser;
        saveUsers();
        console.log('💾 Usuário atual salvo:', currentUser.username);
      }
    }
  }
  
  // ==================== GERADOR DE WALLET ====================
  function generateWalletAddress() {
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    let random = '';
    for(let i = 0; i < 40; i++) {
      random += chars[Math.floor(Math.random() * chars.length)];
    }
    return `Br${random}`;
  }
  
  function generateSeedPhrase() {
    const words = ["abandon","ability","able","about","above","absent","absorb","abstract","absurd","abuse","access","accident","account","accuse","achieve","acid","acoustic","acquire","across","act","action","actor","actress","actual","adapt","add","addict","address","adjust","admit","adult","advance","advice","aerobic","affair","afford","afraid","africa","after","again","age","agent","agree","ahead","aim","air","airport","aisle","alarm","album","alcohol","alert","alien","all","alley","allow","almost","alone","alpha","already","also","alter","always","amazing","among","amount","amuse","angel","anger","angle","angry","animal","ankle","announce","annual","another","answer","antenna","antique","anxiety","any","apart","apology","appear","apple","approve","april"];
    let seed = [];
    for(let i = 0; i < 12; i++) {
      seed.push(words[Math.floor(Math.random() * words.length)]);
    }
    return seed.join(' ');
  }
  
  // ==================== API FUNCTIONS ====================
  async function syncBalanceWithAPI(address) {
    try {
      console.log('🔄 Sincronizando com API:', address);
      const response = await fetch(`${API_URL}/api/balance/${address}`);
      const data = await response.json();
      console.log('📡 Resposta da API:', data);
      
      if (data && data.success && data.data) {
        return data.data.balance || 0;
      }
      return null;
    } catch (error) {
      console.log('⚠️ Erro na API:', error.message);
      return null;
    }
  }

  async function sendBRDToAPI(fromAddress, toAddress, amount) {
    try {
      console.log('💸 Enviando transação:', { fromAddress, toAddress, amount });
      const response = await fetch(`${API_URL}/api/send`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fromAddress, toAddress, amount })
      });
      const data = await response.json();
      console.log('📡 Resposta do envio:', data);
      return data.success ? data.data : null;
    } catch (error) {
      console.log('⚠️ Erro no envio:', error.message);
      return null;
    }
  }

  async function registerUserOnAPI(username, password) {
    try {
      const response = await fetch(`${API_URL}/api/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await response.json();
      console.log('📡 Resposta do registro:', data);
      return data.success;
    } catch (error) {
      console.log('⚠️ Erro no registro na API:', error.message);
      return false;
    }
  }

  async function listAllWallets() {
    try {
      const response = await fetch(`${API_URL}/api/users`);
      const data = await response.json();
      if (data && data.success && data.data) {
        allWallets = data.data.users || [];
        console.log('📊 Wallets carregadas:', allWallets.length);
        return allWallets;
      }
      return [];
    } catch (error) {
      console.log('⚠️ Erro ao listar wallets:', error.message);
      return [];
    }
  }

  async function checkAPIConnection() {
    try {
      const response = await fetch(`${API_URL}/health`);
      const data = await response.json();
      console.log('📡 Status da API:', data);
      return data.status === 'ok';
    } catch (error) {
      console.log('⚠️ API Offline:', error.message);
      return false;
    }
  }
  
  // ==================== REGISTRO E LOGIN ====================
  async function registerUser(username, password) {
    console.log('📝 Registrando usuário:', username);
    
    if (users.length >= 3) {
      return { success: false, message: '⚠️ Máximo de 3 usuários permitidos' };
    }
    
    if (users.find(u => u.username === username)) {
      return { success: false, message: '⚠️ Username já existe' };
    }
    
    if (username.length < 3) {
      return { success: false, message: '⚠️ Username deve ter pelo menos 3 caracteres' };
    }
    if (password.length < 4) {
      return { success: false, message: '⚠️ Senha deve ter pelo menos 4 caracteres' };
    }
    
    const initialBalance = RESERVE_SUPPLY_BRD;
    
    const newUser = {
      id: Date.now(),
      username: username,
      password: password,
      walletAddress: generateWalletAddress(),
      seedPhrase: generateSeedPhrase(),
      balance: initialBalance,
      activeStake: null,
      transactions: [],
      createdAt: new Date().toISOString(),
      lastSync: null,
      syncedWithAPI: false
    };
    
    users.push(newUser);
    saveUsers();
    console.log('✅ Usuário criado localmente:', newUser.walletAddress);
    
    try {
      await registerUserOnAPI(username, password);
      console.log('✅ Usuário registrado na API');
    } catch (error) {
      console.log('⚠️ Erro ao registrar na API:', error.message);
    }
    
    return {
      success: true,
      message: '✅ Conta criada com sucesso!',
      wallet: newUser.walletAddress,
      balance: initialBalance
    };
  }
  
  async function loginUser(username, password) {
    console.log('🔐 Tentando login:', username);
    
    const user = users.find(u => u.username === username && u.password === password);
    if (!user) {
      console.log('❌ Usuário não encontrado localmente');
      return { success: false, message: '❌ Usuário ou senha inválidos' };
    }
    
    console.log('✅ Usuário encontrado localmente:', user.walletAddress);
    
    try {
      const apiBalance = await syncBalanceWithAPI(user.walletAddress);
      if (apiBalance !== null && apiBalance !== user.balance) {
        console.log('🔄 Atualizando saldo da API:', apiBalance);
        user.balance = apiBalance;
        user.lastSync = new Date().toISOString();
        user.syncedWithAPI = true;
        saveUsers();
      }
    } catch (error) {
      console.log('⚠️ Erro ao sincronizar saldo:', error.message);
    }
    
    currentUser = user;
    localStorage.setItem('bradicoin_premium_session', JSON.stringify({ id: user.id }));
    console.log('✅ Login realizado:', currentUser.username);
    
    await listAllWallets();
    
    return { success: true };
  }
  
  function logout() {
    currentUser = null;
    localStorage.removeItem('bradicoin_premium_session');
    console.log('🚪 Logout realizado');
    render();
  }
  
  function loadSession() {
    try {
      const saved = localStorage.getItem('bradicoin_premium_session');
      if(saved) {
        const session = JSON.parse(saved);
        const user = users.find(u => u.id === session.id);
        if(user) {
          currentUser = user;
          console.log('🔑 Sessão carregada:', currentUser.username);
          listAllWallets();
          return true;
        }
      }
    } catch(e) {
      console.error('❌ Erro ao carregar sessão:', e);
    }
    return false;
  }
  
  // ==================== TRANSAÇÕES ====================
  function addTransaction(type, details, amount, address = null) {
    if(!currentUser) return;
    if(!currentUser.transactions) currentUser.transactions = [];
    
    const now = new Date();
    const dateStr = now.toLocaleString('pt-BR', { 
      day: '2-digit', 
      month: '2-digit', 
      hour: '2-digit', 
      minute: '2-digit' 
    });
    
    currentUser.transactions.unshift({
      id: Date.now(),
      type: type,
      details: details,
      amount: amount,
      address: address,
      date: dateStr,
      timestamp: now.getTime()
    });
    
    if(currentUser.transactions.length > 50) {
      currentUser.transactions.pop();
    }
    
    saveCurrentUser();
    console.log('📝 Transação adicionada:', type, details);
  }
  
  // ==================== FUNÇÃO DE ENVIO CORRIGIDA ====================
  async function sendBRD(toAddress, amount) {
    if (!currentUser) {
      showStatus('❌ Nenhum usuário logado', 'sendStatus', 'error');
      return;
    }
    
    if (!toAddress || toAddress.trim() === '') {
      showStatus('📍 Digite o endereço de destino', 'sendStatus', 'error');
      return;
    }
    
    if (!toAddress.startsWith('Br')) {
      showStatus('⚠️ Endereço inválido. Deve começar com "Br"', 'sendStatus', 'error');
      return;
    }
    
    if (amount <= 0) {
      showStatus('💰 Digite um valor válido', 'sendStatus', 'error');
      return;
    }
    
    if (amount > currentUser.balance) {
      showStatus(`⚠️ Saldo insuficiente. Você tem ${currentUser.balance.toLocaleString()} BRD`, 'sendStatus', 'error');
      return;
    }

    // Salva o estado do stake ANTES do envio
    const stakeSnapshot = currentUser.activeStake ? { 
      ...currentUser.activeStake,
      _snapshotTime: Date.now()
    } : null;

    showStatus('⏳ Enviando transação para a blockchain...', 'sendStatus', 'info');

    try {
      const result = await sendBRDToAPI(currentUser.walletAddress, toAddress, amount);

      if (result) {
        const newBalance = result.newBalance !== undefined ? result.newBalance : (currentUser.balance - amount);
        currentUser.balance = newBalance;
        
        // 🔒 RESTAURA O STAKE (caso tenha sido perdido)
        if (stakeSnapshot && !currentUser.activeStake) {
          currentUser.activeStake = {
            amount: stakeSnapshot.amount,
            seconds: stakeSnapshot.seconds,
            name: stakeSnapshot.name,
            apr: stakeSnapshot.apr,
            endTime: stakeSnapshot.endTime,
            startTime: stakeSnapshot.startTime
          };
          console.log('🔒 Stake restaurado com sucesso!');
        }
        
        addTransaction('SENT', `Enviou ${amount.toLocaleString()} BRD para ${toAddress.substring(0, 20)}...`, amount, toAddress);
        saveCurrentUser();
        renderDashboard();
        showStatus(`✅ ${amount.toLocaleString()} BRD enviado com sucesso!`, 'sendStatus', 'success');
      } else {
        // Fallback: transação local
        currentUser.balance -= amount;
        
        // Restaura o stake
        if (stakeSnapshot && !currentUser.activeStake) {
          currentUser.activeStake = stakeSnapshot;
          console.log('🔒 Stake restaurado após falha');
        }
        
        addTransaction('SENT', `Enviou ${amount.toLocaleString()} BRD para ${toAddress.substring(0, 20)}... (offline)`, amount, toAddress);
        saveCurrentUser();
        renderDashboard();

  function copyToClipboardManual(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        showStatus(`📋 Endereço copiado!`, 'searchStatus', 'success');
      }).catch(() => {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }
  
  function fallbackCopy(text) {
    const textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.opacity = '0';
    document.body.appendChild(textArea);
    textArea.select();
    try {
      document.execCommand('copy');
      showStatus(`📋 Endereço copiado!`, 'searchStatus', 'success');
    } catch (e) {
      showStatus(`❌ Falha ao copiar`, 'searchStatus', 'error');
    }
    document.body.removeChild(textArea);

  // ==================== STAKING CORRIGIDO ====================
  const stakeOptions = [
    { name: "2 Minutes", seconds: 120, minStake: 1, apr: APR_2MIN, icon: "⚡" },
    { name: "30 Minutes", seconds: 1800, minStake: 1, apr: APR_30MIN, icon: "⏱️" },
    { name: "1 Hour", seconds: 3600, minStake: 1, apr: APR_1HOUR, icon: "⌛" },
    { name: "1 Day", seconds: 86400, minStake: 10, apr: APR_1DAY, icon: "📅" }
  ];
  
  function calcReward(amount, seconds, apr) {
    const years = seconds / 31536000;
    return amount * (apr / 100) * years;
  }
  
  function doStake(amount, option) {
    if(!currentUser) return;
    if(amount <= 0) { showStatus('💰 Digite um valor válido', 'stakeStatus', 'error'); return; }
    if(amount > currentUser.balance) { showStatus('⚠️ Saldo insuficiente', 'stakeStatus', 'error'); return; }
    if(amount < option.minStake) { showStatus(`⚠️ Mínimo ${option.minStake} BRD`, 'stakeStatus', 'error'); return; }
    
    if(currentUser.activeStake && currentUser.activeStake.endTime > Date.now()) {
      showStatus('🔒 Você já tem um stake ativo!', 'stakeStatus', 'error');
      return;
    }
    
    if(currentUser.activeStake && currentUser.activeStake.endTime <= Date.now()) {
      const oldApr = currentUser.activeStake.apr;
      const reward = calcReward(currentUser.activeStake.amount, currentUser.activeStake.seconds, oldApr);
      currentUser.balance += currentUser.activeStake.amount + reward;
      addTransaction('STAKE_REWARD', `Recompensa de ${currentUser.activeStake.name} (${oldApr}% APR)`, reward);
    }
    
    currentUser.activeStake = {
      amount: amount,
      seconds: option.seconds,
      name: option.name,
      apr: option.apr,
      endTime: Date.now() + (option.seconds * 1000),
      startTime: Date.now()
    };
    currentUser.balance -= amount;
    addTransaction('STAKE', `Stake de ${amount.toLocaleString()} BRD em ${option.name} (${option.apr}% APR)`, amount);
    saveCurrentUser();
    renderDashboard();
    showStatus(`✅ ${amount.toLocaleString()} BRD em stake em ${option.name}!`, 'stakeStatus', 'success');
  }
  
  // ==================== FUNÇÃO UNSTAKE CORRIGIDA ====================
  function doUnstake() {
    if(!currentUser || !currentUser.activeStake) {
      showStatus('❌ Nenhum stake ativo', 'stakeStatus', 'error');
      return;
    }
    
    if(Date.now() < currentUser.activeStake.endTime) {
      showStatus('⏳ Stake ainda bloqueado!', 'stakeStatus', 'error');
      return;
    }
    
    try {
      const stakeAmount = currentUser.activeStake.amount;
      const seconds = currentUser.activeStake.seconds;
      const apr = currentUser.activeStake.apr;
      const stakeName = currentUser.activeStake.name;
      
      const reward = calcReward(stakeAmount, seconds, apr);
      const totalReturn = stakeAmount + reward;
      
      // ✅ ADICIONA AO SALDO (CORRIGIDO)
      const oldBalance = currentUser.balance;
      currentUser.balance += totalReturn;
      const newBalance = currentUser.balance;
      
      addTransaction('UNSTAKE', `Unstake de ${stakeAmount.toLocaleString()} BRD de ${stakeName} (${apr}% APR)`, stakeAmount);
      addTransaction('REWARD', `Recompensa: ${reward.toFixed(4)} BRD (${apr}% APR)`, reward);
      
      currentUser.activeStake = null;
      saveCurrentUser();
      renderDashboard();
      
      showStatus(
        `✅ Unstake! ${totalReturn.toFixed(4)} BRD adicionados (${reward.toFixed(4)} de recompensa) | Novo saldo: ${newBalance.toLocaleString()} BRD`, 
        'stakeStatus', 
        'success'
      );
      
      console.log('💰 UNSTAKE COMPLETO:');
      console.log(`   Stake original: ${stakeAmount.toLocaleString()} BRD`);
      console.log(`   Recompensa: ${reward.toFixed(4)} BRD`);
      console.log(`   Total recebido: ${totalReturn.toFixed(4)} BRD`);
      console.log(`   Saldo anterior: ${oldBalance.toLocaleString()} BRD`);
      console.log(`   Novo saldo: ${newBalance.toLocaleString()} BRD`);
      
    } catch (error) {
      console.error('❌ Erro no unstake:', error);
      showStatus(`❌ Erro ao fazer unstake: ${error.message}`, 'stakeStatus', 'error');
    }
  }
  
  function getStakeProgress() {
    if(!currentUser || !currentUser.activeStake) return 0;
    const total = currentUser.activeStake.seconds * 1000;
    const elapsed = Date.now() - currentUser.activeStake.startTime;
    return Math.min(100, (elapsed / total) * 100);
  }
  
  function getTimeRemaining() {
    if(!currentUser || !currentUser.activeStake) return null;
    const remaining = currentUser.activeStake.endTime - Date.now();
    if(remaining <= 0) return 'Pronto para unstake!';
    const hours = Math.floor(remaining / 3600000);
    const mins = Math.floor((remaining % 3600000) / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    if(hours > 0) return `${hours}h ${mins}m ${secs}s`;
    if(mins > 0) return `${mins}m ${secs}s`;
    return `${secs}s`;
  }

          <button id="openExplorerBtn" class="btn btn-outline"><i class="fas fa-external-link-alt"></i> Explorador</button>

        <div class="balance-amount" style="font-size: 2rem;">$${userBalanceUSD.toLocaleString()} <span style="font-size: 0.9rem;">USD</span></div>
        <div style="font-size: 12px; margin-top: 12px;">📊 1 BRD = $${BRD_TO_USD} USD</div>
        <div id="syncStatus" class="status-msg" style="margin-top: 12px;"></div>
      </div>
      
      <div class="grid">
        <!-- WALLET CARD -->
        <div class="glass-card">
          <div class="card-header"><i class="fas fa-wallet"></i> Minha Wallet</div>
          <div class="wallet-box">
            <div style="font-size: 11px; color: #a855f7; margin-bottom: 8px;">📌 ENDEREÇO</div>
            <div style="font-family: monospace; font-size: 10px; word-break: break-all;">${currentUser.walletAddress}</div>
          </div>
          <div class="inline-buttons">
            <button id="copyAddressBtn" class="btn btn-outline" style="flex: 1;"><i class="fas fa-copy"></i> Copiar</button>
            <button id="lookupChainBtn" class="btn btn-bradichain" style="flex: 1;"><i class="fas fa-link"></i> Explorador</button>
          </div>
          <div class="wallet-box" style="margin-top: 16px;">
            <div style="font-size: 11px; color: #a855f7; margin-bottom: 8px;">🔐 FRASE SEED</div>
            <div style="font-family: monospace; font-size: 9px; word-break: break-all;">${currentUser.seedPhrase}</div>
          </div>
          <div style="margin-top: 12px; font-size: 11px; color: ${currentUser.syncedWithAPI ? '#00ff88' : '#ffaa66'};">
            ${currentUser.syncedWithAPI ? '✅ Sincronizado com API' : '⚠️ Dados locais apenas'}
          </div>
        </div>
        
        <!-- STAKING CARD -->
        <div class="glass-card">
          <div class="card-header"><i class="fas fa-lock"></i> Staking Pools</div>
          <div style="margin-bottom: 12px; font-size: 11px; color: #ffaa66;">⚡ APR de 130% em 2min!</div>
          ${stakeOptionsHtml}
          <div id="stakeStatus" class="status-msg"></div>
          <hr>
          <div class="card-header" style="margin-top: 10px;"><i class="fas fa-chart-line"></i> Stake Ativo</div>
          ${stakeHtml}
          <button id="unstakeBtn" class="btn btn-primary" style="width: 100%; margin-top: 16px;">🔓 Unstake</button>
        </div>
        
        <!-- SEND/RECEIVE CARD -->
        <div class="glass-card">
          <div class="card-header"><i class="fas fa-exchange-alt"></i> Enviar / Receber</div>
          
          <!-- SEÇÃO DE ENVIO -->
          <div class="send-section">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
              <i class="fas fa-paper-plane" style="color: #ffd700;"></i>
              <span style="color: #ffd700; font-weight: bold;">ENVIAR BRD</span>
            </div>
            
            <!-- Selecionar wallet da lista -->
            <div style="margin-bottom: 12px;">
              <label style="font-size: 10px; color: #a855f7;">OU SELECIONE UMA WALLET DA LISTA:</label>
              <select id="walletSelect" class="wallet-select" onchange="document.getElementById('sendTo').value=this.value;">
                <option value="">-- Selecione uma wallet --</option>
                ${walletOptions}
                <option value="${currentUser.walletAddress}">👤 Minha Wallet (${currentUser.walletAddress.substring(0, 16)}...)</option>
              </select>
            </div>
            
            <input type="text" id="sendTo" class="input" placeholder="📍 Endereço de destino (Br...)" style="margin-bottom: 12px;">
            
            <!-- Quick amounts -->
            <div class="quick-amount">
              <button class="btn btn-outline" style="padding: 4px 12px; font-size: 10px;" onclick="document.getElementById('sendAmount').value=100">100</button>
              <button class="btn btn-outline" style="padding: 4px 12px; font-size: 10px;" onclick="document.getElementById('sendAmount').value=1000">1K</button>
              <button class="btn btn-outline" style="padding: 4px 12px; font-size: 10px;" onclick="document.getElementById('sendAmount').value=10000">10K</button>
              <button class="btn btn-outline" style="padding: 4px 12px; font-size: 10px;" onclick="document.getElementById('sendAmount').value=100000">100K</button>
              <button class="btn btn-outline" style="padding: 4px 12px; font-size: 10px;" onclick="document.getElementById('sendAmount').value=1000000">1M</button>
              <button class="btn btn-reserve" style="padding: 4px 12px; font-size: 10px;" onclick="document.getElementById('sendAmount').value=${(currentUser.balance * 0.5).toFixed(0)}">50%</button>
              <button class="btn btn-reserve" style="padding: 4px 12px; font-size: 10px;" onclick="document.getElementById('sendAmount').value=${currentUser.balance}">100%</button>
            </div>
            
            <input type="number" id="sendAmount" class="input" placeholder="💰 Quantidade (BRD)" style="margin-bottom: 12px;">
            
            <button id="sendBtn" class="btn btn-primary" style="width: 100%;"><i class="fas fa-paper-plane"></i> Enviar BRD</button>
            <div id="sendStatus" class="status-msg"></div>
          </div>
          
          <hr>
          
          <!-- SEÇÃO DE RECEBER -->
          <div style="margin-top: 12px;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
              <i class="fas fa-download" style="color: #00ff88;"></i>
              <span style="color: #00ff88; font-weight: bold;">RECEBER (SIMULAR)</span>
            </div>
            
            <div class="quick-amount">
              <button class="btn btn-outline" style="padding: 4px 12px; font-size: 10px;" onclick="document.getElementById('receiveAmount').value=100">100</button>
              <button class="btn btn-outline" style="padding: 4px 12px; font-size: 10px;" onclick="document.getElementById('receiveAmount').value=1000">1K</button>
              <button class="btn btn-outline" style="padding: 4px 12px; font-size: 10px;" onclick="document.getElementById('receiveAmount').value=10000">10K</button>
              <button class="btn btn-outline" style="padding: 4px 12px; font-size: 10px;" onclick="document.getElementById('receiveAmount').value=100000">100K</button>
            </div>
            
            <input type="number" id="receiveAmount" class="input" placeholder="💰 Quantidade (BRD)" style="margin-bottom: 12px;">
            <button id="receiveBtn" class="btn btn-success" style="width: 100%;"><i class="fas fa-download"></i> Receber (Simular)</button>
          </div>
        </div>
      </div>
      
      <!-- TRANSACTIONS -->
      <div class="glass-card" style="padding: 24px;">
        <div class="card-header"><i class="fas fa-history"></i> Histórico de Transações</div>
        <div class="history-container">
          <table class="history-table">
            <thead><tr><th>Data</th><th>Tipo</th><th>Detalhes</th><th>Valor</th></tr></thead>
            <tbody>${historyHtml}</tbody>
          </table>
        </div>
      </div>
      
      <footer>
        <i class="fas fa-shield-alt"></i> BRADICOIN RESERVE FUND | 1 BRD = $10 USD | Reserve: 100.000.000.000.000.000 BRD | 130% APR | Powered by Bradichain
      </footer>
    `;
    
    document.getElementById('app').innerHTML = html;
    
    // Event listeners
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('syncBtn').onclick = syncWalletWithBlockchain;
    document.getElementById('copyAddressBtn').onclick = function() {
      copyToClipboardManual(currentUser.walletAddress);
    };
    document.getElementById('lookupChainBtn').onclick = lookupOnBradichain;
    document.getElementById('sendBtn').onclick = function() {
      const to = document.getElementById('sendTo').value.trim();
      const amount = parseFloat(document.getElementById('sendAmount').value);
      if(!to) {
        showStatus('📍 Digite o endereço de destino', 'sendStatus', 'error');
        return;
      }
      if(!amount || amount <= 0) {
        showStatus('💰 Digite um valor válido', 'sendStatus', 'error');
        return;
      }
      sendBRD(to, amount);
    };
    document.getElementById('receiveBtn').onclick = function() {
      const amount = parseFloat(document.getElementById('receiveAmount').value);
      if(!amount || amount <= 0) {
        showStatus('💰 Digite um valor válido', 'sendStatus', 'error');
        return;
      }
      simulateReceive(amount);
    };
    document.getElementById('unstakeBtn').onclick = doUnstake;
    document.getElementById('consultWalletBtn').onclick = consultarWalletBradichain;
    document.getElementById('openExplorerBtn').onclick = function() {
      const addr = document.getElementById('searchWalletAddress').value.trim();
      if(addr) {
        openBradichainExplorer(addr);
      } else {
        showStatus('📌 Digite um endereço', 'searchStatus', 'error');
      }
    };
    
    // Atualiza o campo sendTo quando selecionar uma wallet
    document.getElementById('walletSelect')?.addEventListener('change', function() {
      document.getElementById('sendTo').value = this.value;
    });
    
    document.querySelectorAll('.stakeBtn').forEach(function(btn) {
      btn.onclick = function() {
        const name = btn.dataset.name;
        const inputId = 'stakeAmt_' + name.replace(/\s/g,'');
        const amount = parseFloat(document.getElementById(inputId).value);
        const option = stakeOptions.find(function(o) { return o.name === name; });
        if(option && amount > 0) {
          doStake(amount, option);
        } else {
          showStatus('💰 Digite um valor válido', 'stakeStatus', 'error');
        }
      };
    });
  }
  
  // ==================== RENDER PRINCIPAL ====================
  function render() {
    console.log('🔄 Renderizando página...');
    loadUsers();
    const hasSession = loadSession();
    
    console.log('📊 Usuários carregados:', users.length);
    console.log('👤 Usuário atual:', currentUser ? currentUser.username : 'Nenhum');
    
    if(currentUser) {
      console.log('✅ Usuário logado, renderizando dashboard');
      renderDashboard();
      setTimeout(function() {
        syncWalletWithBlockchain();
      }, 2000);
    } else {
      console.log('❌ Nenhum usuário logado, renderizando login');
      renderAuth();
    }
  }
  
  // ==================== INICIALIZAÇÃO ====================
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
  
  console.log('🚀 Bradicoin Reserve Fund carregado!');
  console.log('📡 API URL:', API_URL);
  console.log('🌐 Bradichain URL:', BRADICHAIN_URL);
  console.log('💲 1 BRD = $' + BRD_TO_USD + ' USD');
  console.log('💎 Reserva: ' + RESERVE_SUPPLY_BRD.toLocaleString() + ' BRD');

</script>
