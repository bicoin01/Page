<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bradicoin Reserve Fund | Futuristic Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Orbitron', monospace;
      background: radial-gradient(circle at 20% 30%, #0a0f1e, #03050b);
      color: #e0e5ff;
      min-height: 100vh;
      padding: 1.5rem;
      letter-spacing: 0.5px;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    
    /* Neon Glow Effects */
    .neon-card {
      background: rgba(8, 12, 26, 0.75);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      border: 1px solid #a855f7;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
      padding: 1.5rem;
      transition: all 0.3s ease;
    }
    .neon-card:hover {
      border-color: #00f2ff;
      box-shadow: 0 0 30px rgba(0, 242, 255, 0.4);
      transform: translateY(-3px);
    }
    
    .cyber-btn {
      background: rgba(0,0,0,0.6);
      border: 1.5px solid #a855f7;
      color: #e0e5ff;
      font-family: 'Orbitron', monospace;
      font-weight: 600;
      padding: 0.7rem 1.5rem;
      border-radius: 2rem;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .cyber-btn:hover {
      background: #a855f7;
      border-color: #00f2ff;
      box-shadow: 0 0 15px #a855f7;
      transform: translateY(-2px);
    }
    .cyber-btn.primary {
      background: linear-gradient(95deg, #a855f7, #3b82f6);
      border: none;
    }
    
    .cyber-input {
      background: #010518;
      border: 1px solid #a855f7;
      padding: 0.8rem 1rem;
      border-radius: 1rem;
      color: #e0e5ff;
      font-family: 'Orbitron', monospace;
      width: 100%;
      outline: none;
    }
    .cyber-input:focus {
      border-color: #00f2ff;
      box-shadow: 0 0 10px #00f2ff;
    }
    
    /* Auth Pages */
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .auth-box {
      max-width: 450px;
      width: 100%;
      text-align: center;
    }
    .logo-large {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #a855f7, #00f2ff);
      border-radius: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 3rem;
      color: #0a0f1e;
    }
    
    /* Dashboard Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    
    .staking-timer {
      font-size: 0.75rem;
      color: #00f2ff;
      text-align: center;
      margin-top: 0.5rem;
    }
    .progress-bar {
      background: #1a1f30;
      border-radius: 1rem;
      height: 8px;
      overflow: hidden;
      margin: 0.5rem 0;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #a855f7, #00f2ff);
      transition: width 0.3s;
    }
    .balance-amount {
      font-size: 2.5rem;
      font-weight: 800;
      color: #00f2ff;
      text-shadow: 0 0 10px #00f2ff;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      padding: 1rem 1.5rem;
      background: rgba(12,20,35,0.7);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      border: 1px solid #a855f7;
    }
    .lang-selector {
      background: #0f1422dd;
      border: 1px solid #a855f7;
      border-radius: 2rem;
      padding: 0.5rem;
      font-family: 'Orbitron', monospace;
      color: #e0e5ff;
      cursor: pointer;
    }
    footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.7rem;
      opacity: 0.7;
    }
    .status-msg {
      font-size: 0.7rem;
      margin-top: 0.5rem;
      color: #00f2ff;
    }
    .alert {
      color: #ff0055;
    }
  </style>
</head>
<body>
<div class="container" id="appRoot"></div>

<script>
  // ==================== LIMITED USER SYSTEM (MAX 3 REGISTRATIONS) ====================
  // Pre-defined allowed users - only 3 accounts can be created
  let users = [];
  let currentUser = null;
  let currentLang = 'en';
  
  // Load users from localStorage
  function loadUsers() {
    const stored = localStorage.getItem('bradicoin_reserve_users');
    if(stored) {
      users = JSON.parse(stored);
    } else {
      // Initialize with empty users array - allows up to 3 registrations
      users = [];
      localStorage.setItem('bradicoin_reserve_users', JSON.stringify(users));
    }
  }
  
  function saveUsers() {
    localStorage.setItem('bradicoin_reserve_users', JSON.stringify(users));
  }
  
  // Check if registration is still available (max 3 users)
  function canRegister() {
    return users.length < 3;
  }
  
  // Register new user
  function registerUser(username, password) {
    if(!canRegister()) {
      return { success: false, message: "Registration limit reached. Maximum 3 users allowed." };
    }
    if(users.find(u => u.username === username)) {
      return { success: false, message: "Username already exists." };
    }
    if(username.length < 3 || password.length < 4) {
      return { success: false, message: "Username (min 3 chars) and password (min 4 chars) required." };
    }
    // Create new user with initial balance
    const newUser = {
      id: Date.now(),
      username: username,
      password: password,
      balance: 5000, // Initial BRD balance
      activeStake: null,
      airdropClaimed: false,
      referralCode: "RES" + Math.random().toString(36).substring(2, 8).toUpperCase()
    };
    users.push(newUser);
    saveUsers();
    return { success: true, message: "Account created successfully!" };
  }
  
  // Login user
  function loginUser(username, password) {
    const user = users.find(u => u.username === username && u.password === password);
    if(user) {
      currentUser = user;
      localStorage.setItem('bradicoin_reserve_current', JSON.stringify({ id: user.id, username: user.username }));
      return { success: true };
    }
    return { success: false, message: "Invalid username or password." };
  }
  
  function logout() {
    currentUser = null;
    localStorage.removeItem('bradicoin_reserve_current');
    renderApp();
  }
  
  function loadCurrentSession() {
    const saved = localStorage.getItem('bradicoin_reserve_current');
    if(saved) {
      const session = JSON.parse(saved);
      const user = users.find(u => u.id === session.id);
      if(user) {
        currentUser = user;
      }
    }
  }
  
  function saveUserData() {
    if(currentUser) {
      const index = users.findIndex(u => u.id === currentUser.id);
      if(index !== -1) {
        users[index] = currentUser;
        saveUsers();
      }
    }
  }
  
  // ==================== STAKING FUNCTIONS (50% APR) ====================
  const stakingOptions = [
    { name: "1 Hour", periodSeconds: 3600, apr: 50, minStake: 10 },
    { name: "1 Day", periodSeconds: 86400, apr: 50, minStake: 50 }
  ];
  
  function calculateReward(amount, periodSeconds) {
    return amount * (0.50 * (periodSeconds / 31536000));
  }
  
  function stake(amount, option) {
    if(!currentUser) return;
    if(amount <= 0 || amount > currentUser.balance) {
      showStatus("Invalid amount or insufficient balance", 'stakeStatus');
      return;
    }
    if(amount < option.minStake) {
      showStatus(`Minimum stake is ${option.minStake} BRD`, 'stakeStatus');
      return;
    }
    if(currentUser.activeStake && currentUser.activeStake.lockEndTime > Date.now()) {
      showStatus("You already have an active stake! Wait or unstake first.", 'stakeStatus');
      return;
    }
    if(currentUser.activeStake && currentUser.activeStake.lockEndTime <= Date.now()) {
      const reward = calculateReward(currentUser.activeStake.amount, currentUser.activeStake.periodSeconds);
      currentUser.balance += currentUser.activeStake.amount + reward;
      addNotification(`Previous stake matured! +${reward.toFixed(4)} BRD reward`);
    }
    currentUser.activeStake = {
      amount: amount,
      lockEndTime: Date.now() + (option.periodSeconds * 1000),
      periodSeconds: option.periodSeconds,
      apr: option.apr,
      optionName: option.name
    };
    currentUser.balance -= amount;
    saveUserData();
    renderDashboard();
    addNotification(`🔒 Staked ${amount} BRD for ${option.name} at 50% APR`);
    showStatus(`Staked ${amount} BRD for ${option.name}!`, 'stakeStatus');
  }
  
  function unstake() {
    if(!currentUser || !currentUser.activeStake) {
      showStatus("No active stake", 'stakeStatus');
      return;
    }
    if(Date.now() < currentUser.activeStake.lockEndTime) {
      showStatus("Stake still locked!", 'stakeStatus');
      return;
    }
    const reward = calculateReward(currentUser.activeStake.amount, currentUser.activeStake.periodSeconds);
    currentUser.balance += currentUser.activeStake.amount + reward;
    addNotification(`✅ Unstaked ${currentUser.activeStake.amount} BRD + ${reward.toFixed(4)} reward (50% APR)`);
    currentUser.activeStake = null;
    saveUserData();
    renderDashboard();
    showStatus(`Unstaked! +${reward.toFixed(4)} BRD`, 'stakeStatus');
  }
  
  function getStakeProgress() {
    if(!currentUser || !currentUser.activeStake) return 0;
    const now = Date.now();
    if(now >= currentUser.activeStake.lockEndTime) return 100;
    const total = currentUser.activeStake.periodSeconds * 1000;
    const elapsed = now - (currentUser.activeStake.lockEndTime - total);
    return Math.min(100, (elapsed / total) * 100);
  }
  
  // ==================== SEND / RECEIVE ====================
  function sendCoins(toAddress, amount) {
    if(!currentUser) return;
    if(!toAddress || amount <= 0 || amount > currentUser.balance) {
      showStatus("Invalid transaction", 'txStatus');
      return;
    }
    // Simulate sending to another address (just deduct balance)
    currentUser.balance -= amount;
    saveUserData();
    renderDashboard();
    addNotification(`💸 Sent ${amount} BRD to ${toAddress.substring(0,10)}...`);
    showStatus(`Sent ${amount} BRD successfully!`, 'txStatus');
  }
  
  function copyAddress() {
    if(currentUser && currentUser.username) {
      const dummyAddress = `0x${currentUser.username}${Math.random().toString(36).substring(2, 10)}`;
      navigator.clipboard.writeText(dummyAddress);
      showStatus("Address copied!", 'txStatus');
    }
  }
  
  // ==================== NOTIFICATIONS ====================
  let notifications = [{ text: "✨ Welcome to Bradicoin Reserve Fund! 50% APR Staking", read: false }];
  
  function addNotification(text) {
    notifications.unshift({ text, read: false });
    if(notifications.length > 10) notifications.pop();
    renderNotifications();
  }
  
  function renderNotifications() {
    const panel = document.getElementById('notifPanel');
    const countSpan = document.getElementById('notifCount');
    if(panel) {
      const unread = notifications.filter(n => !n.read).length;
      if(countSpan) countSpan.innerText = unread;
      panel.innerHTML = `<h4>🔔 Notifications</h4>${notifications.map(n => `<div style="padding:0.5rem; border-bottom:1px solid #a855f7;">${n.text}</div>`).join('')}`;
    }
  }
  
  function toggleNotifications() {
    const panel = document.getElementById('notificationPanel');
    if(panel) panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    notifications.forEach(n => n.read = true);
    renderNotifications();
  }
  
  function showStatus(msg, elementId) {
    const el = document.getElementById(elementId);
    if(el) {
      el.innerText = msg;
      setTimeout(() => { if(el.innerText === msg) el.innerText = ""; }, 4000);
    }
  }
  
  // ==================== TRANSLATIONS (EN/PT) ====================
  const translations = {
    en: {
      title: "BRADICOIN RESERVE FUND", login: "Login", register: "Register", logout: "Logout",
      username: "Username", password: "Password", confirmPassword: "Confirm Password",
      loginBtn: "Sign In", registerBtn: "Create Account", noAccount: "Don't have an account?",
      hasAccount: "Already have an account?", dashboard: "Dashboard", balance: "Balance",
      walletAddress: "Wallet Address", copy: "Copy", sendReceive: "Send / Receive",
      recipient: "Recipient Address", amount: "Amount (BRD)", send: "Send BRD",
      staking: "Staking Pools (50% APR)", stakeFor: "Stake for", lock: "Lock", min: "Min",
      noStake: "No active stake", unstake: "Unstake Matured", reward: "Reward",
      explorer: "Bradichain Explorer", footer: "BRADICOIN RESERVE ● 50% APR ● Limited Access (Max 3 Users)"
    },
    pt: {
      title: "FUNDO RESERVA BRADICOIN", login: "Entrar", register: "Cadastrar", logout: "Sair",
      username: "Usuário", password: "Senha", confirmPassword: "Confirmar Senha",
      loginBtn: "Entrar", registerBtn: "Criar Conta", noAccount: "Não tem uma conta?",
      hasAccount: "Já tem uma conta?", dashboard: "Painel", balance: "Saldo",
      walletAddress: "Endereço da Carteira", copy: "Copiar", sendReceive: "Enviar / Receber",
      recipient: "Endereço do Destinatário", amount: "Quantidade (BRD)", send: "Enviar BRD",
      staking: "Pools de Staking (50% APR)", stakeFor: "Fazer Stake por", lock: "Bloqueio", min: "Mín",
      noStake: "Nenhum stake ativo", unstake: "Retirar Stake", reward: "Recompensa",
      explorer: "Explorador Bradichain", footer: "FUNDO RESERVA BRADICOIN ● 50% APR ● Acesso Limitado (Máx 3 Usuários)"
    }
  };
  
  function t(key) {
    return translations[currentLang][key] || key;
  }
  
  function updateLanguage() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if(translations[currentLang][key]) el.innerText = translations[currentLang][key];
    });
  }
  
  // ==================== RENDER AUTH PAGES ====================
  let showingLogin = true;
  let registerError = "";
  let loginError = "";
  
  function renderAuth() {
    const html = `
      <div class="auth-container">
        <div class="auth-box neon-card">
          <div class="logo-large"><i class="fas fa-shield-alt"></i></div>
          <h1 data-i18n="title" style="font-size:1.8rem; margin-bottom:0.5rem;">BRADICOIN RESERVE FUND</h1>
          <p style="color:#a855f7; margin-bottom:1.5rem;">🔒 Limited Access · Max 3 Users</p>
          
          ${showingLogin ? `
            <div style="margin-bottom:1rem;">
              <input type="text" id="loginUsername" class="cyber-input" placeholder="${t('username')}" style="margin-bottom:1rem;">
              <input type="password" id="loginPassword" class="cyber-input" placeholder="${t('password')}">
              <div class="status-msg alert" id="loginErrorMsg">${loginError}</div>
              <button id="doLoginBtn" class="cyber-btn primary" style="width:100%; margin-top:1.5rem;"><i class="fas fa-sign-in-alt"></i> ${t('loginBtn')}</button>
            </div>
            <p style="margin-top:1rem;">${t('noAccount')} <a href="#" id="switchToRegister" style="color:#00f2ff;">${t('register')}</a></p>
          ` : `
            <div style="margin-bottom:1rem;">
              <input type="text" id="regUsername" class="cyber-input" placeholder="${t('username')}" style="margin-bottom:1rem;">
              <input type="password" id="regPassword" class="cyber-input" placeholder="${t('password')}" style="margin-bottom:1rem;">
              <input type="password" id="regConfirm" class="cyber-input" placeholder="${t('confirmPassword')}">
              <div class="status-msg alert" id="registerErrorMsg">${registerError}</div>
              <button id="doRegisterBtn" class="cyber-btn primary" style="width:100%; margin-top:1.5rem;"><i class="fas fa-user-plus"></i> ${t('registerBtn')}</button>
            </div>
            <p style="margin-top:1rem;">${t('hasAccount')} <a href="#" id="switchToLogin" style="color:#00f2ff;">${t('login')}</a></p>
          `}
          
          <div style="margin-top:1.5rem; display:flex; justify-content:center; gap:1rem;">
            <select id="langSelectAuth" class="lang-selector"><option value="en">🇬🇧 English</option><option value="pt">🇧🇷 Português</option></select>
          </div>
        </div>
      </div>
    `;
    document.getElementById('appRoot').innerHTML = html;
    
    // Language selector
    document.getElementById('langSelectAuth').value = currentLang;
    document.getElementById('langSelectAuth').onchange = (e) => { currentLang = e.target.value; renderAuth(); };
    
    if(showingLogin) {
      document.getElementById('doLoginBtn').onclick = () => {
        const user = document.getElementById('loginUsername').value;
        const pass = document.getElementById('loginPassword').value;
        const result = loginUser(user, pass);
        if(result.success) {
          renderApp();
        } else {
          loginError = result.message;
          renderAuth();
        }
      };
      document.getElementById('switchToRegister').onclick = (e) => { e.preventDefault(); showingLogin = false; loginError = ""; renderAuth(); };
    } else {
      document.getElementById('doRegisterBtn').onclick = () => {
        const user = document.getElementById('regUsername').value;
        const pass = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirm').value;
        if(pass !== confirm) {
          registerError = "Passwords do not match!";
          renderAuth();
          return;
        }
        const result = registerUser(user, pass);
        if(result.success) {
          showingLogin = true;
          registerError = "";
          renderAuth();
        } else {
          registerError = result.message;
          renderAuth();
        }
      };
      document.getElementById('switchToLogin').onclick = (e) => { e.preventDefault(); showingLogin = true; registerError = ""; renderAuth(); };
    }
    updateLanguage();
  }
  
  // ==================== RENDER DASHBOARD ====================
  function renderDashboard() {
    if(!currentUser) return;
    
    const stakeProgress = getStakeProgress();
    const activeStake = currentUser.activeStake;
    let stakeInfoHtml = `<div class="staking-timer" id="activeStakeInfo">💎 ${t('noStake')}</div>`;
    if(activeStake) {
      if(activeStake.lockEndTime > Date.now()) {
        const remaining = activeStake.lockEndTime - Date.now();
        const hours = Math.floor(remaining / 3600000);
        const mins = Math.floor((remaining % 3600000) / 60000);
        const secs = Math.floor((remaining % 60000) / 1000);
        const reward = calculateReward(activeStake.amount, activeStake.periodSeconds);
        stakeInfoHtml = `
          <div class="progress-bar"><div class="progress-fill" style="width:${stakeProgress}%"></div></div>
          <div class="staking-timer">⏱️ ${activeStake.optionName} remaining: ${hours}h ${mins}m ${secs}s | ${t('reward')}: ${reward.toFixed(4)} BRD</div>
        `;
      } else {
        stakeInfoHtml = `
          <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
          <div class="staking-timer">✅ STAKE MATURED! Click UNSTAKE to claim.</div>
        `;
      }
    }
    
    const stakingOptionsHtml = stakingOptions.map(opt => `
      <div class="neon-card" style="padding:1rem; margin-bottom:0.8rem;">
        <div style="display:flex; justify-content:space-between;"><strong>${opt.name}</strong><span style="color:#00f2ff;">${opt.apr}% APR</span></div>
        <div style="font-size:0.7rem;">${t('lock')}: ${opt.periodSeconds === 3600 ? '1 hour' : '1 day'} | ${t('min')}: ${opt.minStake} BRD</div>
        <input type="number" id="stakeAmount_${opt.name.replace(/\s/g,'')}" class="cyber-input" placeholder="${t('amount')}" step="any" style="margin-top:0.5rem;">
        <button class="cyber-btn stake-btn" data-period="${opt.periodSeconds}" data-name="${opt.name}" style="width:100%; margin-top:0.5rem;"><i class="fas fa-lock"></i> ${t('stakeFor')} ${opt.name}</button>
      </div>
    `).join('');
    
    const html = `
      <div class="top-bar">
        <div><h1><i class="fas fa-shield-alt"></i> <span data-i18n="title">BRADICOIN RESERVE FUND</span></h1></div>
        <div style="display:flex; gap:0.8rem; align-items:center; flex-wrap:wrap;">
          <button id="logoutBtnDashboard" class="cyber-btn"><i class="fas fa-sign-out-alt"></i> ${t('logout')}</button>
          <div class="notification-badge" style="position:relative; cursor:pointer;" id="notifBell"><i class="fas fa-bell"></i><span id="notifCount" class="badge-count" style="position:absolute; top:-8px; right:-8px; background:#ff0055; border-radius:50%; width:18px; height:18px; font-size:10px; display:flex; align-items:center; justify-content:center;">0</span></div>
          <select id="langSelectDash" class="lang-selector"><option value="en">🇬🇧 English</option><option value="pt">🇧🇷 Português</option></select>
        </div>
      </div>
      <div id="notificationPanel" style="display:none; position:fixed; top:80px; right:20px; width:320px; background:#0a0f1e; border:1px solid #a855f7; border-radius:1rem; padding:1rem; z-index:1000; backdrop-filter:blur(12px);"></div>
      
      <div class="dashboard-grid">
        <div class="neon-card">
          <div class="card-title" style="font-size:1.3rem; margin-bottom:1rem;"><i class="fas fa-chart-line"></i> ${t('balance')}</div>
          <div class="balance-amount" id="balanceDisplay">${currentUser.balance.toFixed(4)}</div>
          <div class="balance-label" style="margin-bottom:1rem;">BRD TOKEN</div>
          <div><label>${t('walletAddress')}</label><div class="cyber-input" id="walletAddressDisplay">0x${currentUser.username}...${currentUser.id.toString().slice(-4)}</div></div>
          <button id="copyAddrBtn" class="cyber-btn" style="margin-top:0.5rem; width:100%;"><i class="far fa-copy"></i> ${t('copy')}</button>
          <div style="margin-top:1rem;"><a href="https://www.bradichain.com" target="_blank" style="color:#00f2ff;"><i class="fas fa-globe"></i> ${t('explorer')}</a></div>
        </div>
        
        <div class="neon-card">
          <div class="card-title" style="font-size:1.3rem; margin-bottom:1rem;"><i class="fas fa-layer-group"></i> ${t('staking')}</div>
          ${stakingOptionsHtml}
          <div id="stakeStatus" class="status-msg"></div>
          ${stakeInfoHtml}
          <button id="unstakeBtn" class="cyber-btn" style="width:100%; margin-top:0.5rem;"><i class="fas fa-unlock-alt"></i> ${t('unstake')}</button>
        </div>
        
        <div class="neon-card">
          <div class="card-title" style="font-size:1.3rem; margin-bottom:1rem;"><i class="fas fa-exchange-alt"></i> ${t('sendReceive')}</div>
          <input type="text" id="recipientAddr" class="cyber-input" placeholder="${t('recipient')}">
          <input type="number" id="sendAmount" class="cyber-input" placeholder="${t('amount')}" step="any" style="margin-top:0.5rem;">
          <button id="sendBtn" class="cyber-btn primary" style="width:100%; margin-top:0.5rem;"><i class="fas fa-paper-plane"></i> ${t('send')}</button>
          <div id="txStatus" class="status-msg"></div>
        </div>
      </div>
      <footer><span data-i18n="footer">BRADICOIN RESERVE ● 50% APR ● Limited Access (Max 3 Users)</span></footer>
    `;
    
    document.getElementById('appRoot').innerHTML = html;
    
    // Event listeners
    document.getElementById('logoutBtnDashboard').onclick = () => { logout(); };
    document.getElementById('copyAddrBtn').onclick = copyAddress;
    document.getElementById('sendBtn').onclick = () => {
      const to = document.getElementById('recipientAddr').value;
      const amt = parseFloat(document.getElementById('sendAmount').value);
      sendCoins(to, amt);
    };
    document.getElementById('unstakeBtn').onclick = unstake;
    document.getElementById('notifBell').onclick = toggleNotifications;
    
    document.querySelectorAll('.stake-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const periodSec = parseInt(btn.dataset.period);
        const optName = btn.dataset.name;
        const amountInput = document.getElementById(`stakeAmount_${optName.replace(/\s/g,'')}`);
        const amount = parseFloat(amountInput.value);
        const option = stakingOptions.find(o => o.periodSeconds === periodSec);
        if(option && amount > 0) stake(amount, option);
        else showStatus("Enter valid amount", 'stakeStatus');
      });
    });
    
    document.getElementById('langSelectDash').value = currentLang;
    document.getElementById('langSelectDash').onchange = (e) => { currentLang = e.target.value; renderDashboard(); };
    
    // Update balance periodically
    setInterval(() => {
      if(currentUser) {
        const balanceSpan = document.getElementById('balanceDisplay');
        if(balanceSpan) balanceSpan.innerText = currentUser.balance.toFixed(4);
        const stakeProgress = getStakeProgress();
        const progressFill = document.querySelector('.progress-fill');
        if(progressFill) progressFill.style.width = `${stakeProgress}%`;
      }
    }, 1000);
    
    renderNotifications();
    updateLanguage();
  }
  
  function renderApp() {
    loadUsers();
    loadCurrentSession();
    if(currentUser) {
      renderDashboard();
    } else {
      renderAuth();
    }
  }
  
  renderApp();
</script>
</body>
</html>
