<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bradicoin Reserve Fund | BRD Token</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Orbitron', monospace;
      background: radial-gradient(circle at 20% 30%, #0a0f1e, #03050b);
      color: #e0e5ff;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .neon-card {
      background: rgba(8, 12, 26, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      border: 1px solid #a855f7;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .cyber-btn {
      background: rgba(0,0,0,0.6);
      border: 1.5px solid #a855f7;
      color: #e0e5ff;
      padding: 0.7rem 1.5rem;
      border-radius: 2rem;
      cursor: pointer;
      font-family: 'Orbitron', monospace;
    }
    .cyber-btn.primary { background: linear-gradient(95deg, #a855f7, #3b82f6); border: none; }
    .cyber-input {
      background: #010518;
      border: 1px solid #a855f7;
      padding: 0.8rem;
      border-radius: 1rem;
      color: #e0e5ff;
      width: 100%;
      margin: 0.5rem 0;
    }
    .balance-amount { font-size: 2rem; color: #00f2ff; word-break: break-all; }
    .status-msg { font-size: 0.7rem; color: #00f2ff; margin-top: 0.5rem; }
    .alert { color: #ff0055; }
    .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
    .history-table { width: 100%; border-collapse: collapse; font-size: 0.7rem; }
    .history-table td, .history-table th { padding: 0.5rem; border-bottom: 1px solid #a855f7; }
  </style>
</head>
<body>
<div class="container" id="appRoot"></div>

<script>
  // ==================== CONFIGURAÇÃO ====================
  const API_BASE_URL = 'https://bradicoin-api.onrender.com';
  
  // ==================== USER SYSTEM (LOCAL) ====================
  let users = [];
  let currentUser = null;
  
  function loadUsers() {
    const stored = localStorage.getItem('bradicoin_users');
    if(stored) users = JSON.parse(stored);
    else users = [];
  }
  
  function saveUsers() { localStorage.setItem('bradicoin_users', JSON.stringify(users)); }
  
  function registerUser(username, password) {
    if(users.length >= 3) return { success: false, message: "Maximum 3 users allowed" };
    if(users.find(u => u.username === username)) return { success: false, message: "Username exists" };
    if(username.length < 3) return { success: false, message: "Username min 3 characters" };
    
    // Gerar wallet local
    const walletAddress = `Br${Date.now().toString(36)}${Math.random().toString(36).substring(2, 15)}`;
    const seedPhrase = Array(12).fill(0).map(() => {
      const words = ["abandon","ability","able","about","above","absent","absorb","abstract","absurd","abuse","access","accident","account"];
      return words[Math.floor(Math.random() * words.length)];
    }).join(' ');
    
    const newUser = {
      id: Date.now(),
      username,
      password,
      walletAddress,
      seedPhrase,
      balance: 99999999999999999,
      transactions: []
    };
    users.push(newUser);
    saveUsers();
    
    // Tentar registrar na API também
    fetch(`${API_BASE_URL}/api/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    }).catch(e => console.log('API register note:', e));
    
    return { success: true, message: "Account created!", walletAddress, seedPhrase };
  }
  
  function loginUser(username, password) {
    const user = users.find(u => u.username === username && u.password === password);
    if(user) {
      currentUser = user;
      localStorage.setItem('bradicoin_current', JSON.stringify({ id: user.id }));
      return { success: true };
    }
    return { success: false, message: "Invalid credentials" };
  }
  
  function logout() { currentUser = null; localStorage.removeItem('bradicoin_current'); renderApp(); }
  
  function loadCurrentSession() {
    const saved = localStorage.getItem('bradicoin_current');
    if(saved) {
      const session = JSON.parse(saved);
      const user = users.find(u => u.id === session.id);
      if(user) currentUser = user;
    }
  }
  
  function saveUserData() {
    if(currentUser) {
      const index = users.findIndex(u => u.id === currentUser.id);
      if(index !== -1) { users[index] = currentUser; saveUsers(); }
    }
  }
  
  function addTransaction(type, details, amount, address = null) {
    if(!currentUser) return;
    if(!currentUser.transactions) currentUser.transactions = [];
    currentUser.transactions.unshift({
      id: Date.now(),
      type,
      details,
      amount,
      address,
      date: new Date().toLocaleString()
    });
    if(currentUser.transactions.length > 30) currentUser.transactions.pop();
    saveUserData();
  }
  
  // ==================== FUNÇÕES DA API ====================
  async function consultarSaldo() {
    if(!currentUser) return;
    try {
      showStatus("Consultando saldo...", 'txStatus');
      const response = await fetch(`${API_BASE_URL}/api/balance/${currentUser.walletAddress}`);
      const data = await response.json();
      
      if(data.success) {
        currentUser.balance = data.data.balance;
        saveUserData();
        showStatus(`✅ Saldo: ${currentUser.balance.toLocaleString()} BRD`, 'txStatus');
      } else {
        showStatus(`⚠️ ${data.error || 'Erro'}`, 'txStatus');
      }
      renderDashboard();
    } catch(error) {
      showStatus(`⚠️ Usando saldo local`, 'txStatus');
    }
  }
  
  async function enviarBRD(destino, quantidade) {
    if(!currentUser) return;
    if(!destino) { showStatus("Digite endereço destino", 'txStatus'); return; }
    if(quantidade <= 0) { showStatus("Quantidade inválida", 'txStatus'); return; }
    if(quantidade > currentUser.balance) { showStatus("Saldo insuficiente", 'txStatus'); return; }
    
    try {
      showStatus(`Enviando ${quantidade} BRD...`, 'txStatus');
      const response = await fetch(`${API_BASE_URL}/api/send`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          fromAddress: currentUser.walletAddress, 
          toAddress: destino, 
          amount: quantidade 
        })
      });
      const result = await response.json();
      
      if(result.success) {
        currentUser.balance = result.data?.newBalance || currentUser.balance;
        saveUserData();
        addTransaction('SENT', `Enviado para ${destino.substring(0, 20)}...`, quantidade, destino);
        showStatus(`✅ ${result.message}`, 'txStatus');
        consultarSaldo();
      } else {
        showStatus(`❌ ${result.error}`, 'txStatus');
      }
    } catch(error) {
      showStatus(`❌ Erro: ${error.message}`, 'txStatus');
    }
  }
  
  // ==================== STAKING ====================
  const stakingOptions = [
    { name: "30 Minutes", seconds: 1800, minStake: 50 },
    { name: "1 Hour", seconds: 3600, minStake: 100 },
    { name: "1 Day", seconds: 86400, minStake: 500 }
  ];
  
  function calculateReward(amount, seconds) { return amount * (0.50 * (seconds / 31536000)); }
  
  function stake(amount, option) {
    if(!currentUser) return;
    if(amount <= 0 || amount > currentUser.balance) { showStatus("Invalid amount", 'stakeStatus'); return; }
    if(amount < option.minStake) { showStatus(`Min ${option.minStake} BRD`, 'stakeStatus'); return; }
    if(currentUser.activeStake && currentUser.activeStake.lockEndTime > Date.now()) { showStatus("Active stake exists", 'stakeStatus'); return; }
    
    if(currentUser.activeStake && currentUser.activeStake.lockEndTime <= Date.now()) {
      const reward = calculateReward(currentUser.activeStake.amount, currentUser.activeStake.seconds);
      currentUser.balance += currentUser.activeStake.amount + reward;
      addTransaction('STAKE_REWARD', `Recompensa de staking`, reward, null);
    }
    
    currentUser.activeStake = {
      amount: amount,
      lockEndTime: Date.now() + (option.seconds * 1000),
      seconds: option.seconds,
      optionName: option.name,
      startTime: Date.now()
    };
    currentUser.balance -= amount;
    addTransaction('STAKE', `Stake de ${amount} BRD por ${option.name}`, amount, null);
    saveUserData();
    renderDashboard();
    showStatus(`Staked ${amount} BRD!`, 'stakeStatus');
  }
  
  function unstake() {
    if(!currentUser || !currentUser.activeStake) { showStatus("No active stake", 'stakeStatus'); return; }
    if(Date.now() < currentUser.activeStake.lockEndTime) { showStatus("Stake locked!", 'stakeStatus'); return; }
    
    const reward = calculateReward(currentUser.activeStake.amount, currentUser.activeStake.seconds);
    currentUser.balance += currentUser.activeStake.amount + reward;
    addTransaction('UNSTAKE', `Unstake de ${currentUser.activeStake.amount} BRD`, currentUser.activeStake.amount, null);
    addTransaction('STAKE_REWARD', `Ganho de staking`, reward, null);
    currentUser.activeStake = null;
    saveUserData();
    renderDashboard();
    showStatus(`Unstaked! +${reward.toFixed(4)} BRD`, 'stakeStatus');
  }
  
  function getStakeProgress() {
    if(!currentUser || !currentUser.activeStake) return 0;
    const now = Date.now();
    if(now >= currentUser.activeStake.lockEndTime) return 100;
    const total = currentUser.activeStake.seconds * 1000;
    const elapsed = now - (currentUser.activeStake.lockEndTime - total);
    return Math.min(100, (elapsed / total) * 100);
  }
  
  // ==================== FUNÇÕES AUXILIARES ====================
  function copyAddress() {
    if(currentUser) {
      navigator.clipboard.writeText(currentUser.walletAddress);
      showStatus("Address copied!", 'txStatus');
    }
  }
  
  function receiveFunds(amount) {
    if(!currentUser) return;
    if(!amount || amount <= 0) { showStatus("Invalid amount", 'txStatus'); return; }
    currentUser.balance += amount;
    addTransaction('RECEIVED', `Recebido de wallet externa`, amount, null);
    saveUserData();
    renderDashboard();
    showStatus(`✅ Received ${amount} BRD!`, 'txStatus');
  }
  
  function updateBalanceDisplay() {
    const balSpan = document.getElementById('balanceDisplay');
    if(balSpan && currentUser) balSpan.innerText = currentUser.balance.toLocaleString();
  }
  
  function showStatus(msg, id) {
    const el = document.getElementById(id);
    if(el) { el.innerText = msg; setTimeout(() => { if(el.innerText === msg) el.innerText = ""; }, 5000); }
  }
  
  // ==================== RENDER AUTH ====================
  let showingLogin = true;
  let registerError = "", loginError = "";
  
  function renderAuth() {
    const html = `
      <div style="display:flex; justify-content:center; align-items:center; min-height:80vh;">
        <div class="neon-card" style="max-width:450px; text-align:center;">
          <h1>BRADICOIN RESERVE</h1>
          <p style="color:#a855f7;">Max 3 Users | Wallet Generator</p>
          <p style="color:#00f2ff; font-size:0.7rem;">Total Reserve: 99,999,999,999,999,999 BRD</p>
          ${showingLogin ? `
            <input type="text" id="loginUser" class="cyber-input" placeholder="Username">
            <input type="password" id="loginPass" class="cyber-input" placeholder="Password">
            <div class="status-msg alert" id="loginMsg">${loginError}</div>
            <button id="doLogin" class="cyber-btn primary" style="width:100%;">Login</button>
            <p style="margin-top:1rem;">No account? <a href="#" id="switchReg" style="color:#00f2ff;">Register</a></p>
          ` : `
            <input type="text" id="regUser" class="cyber-input" placeholder="Username">
            <input type="password" id="regPass" class="cyber-input" placeholder="Password">
            <input type="password" id="regConfirm" class="cyber-input" placeholder="Confirm Password">
            <div class="status-msg alert" id="regMsg">${registerError}</div>
            <button id="doReg" class="cyber-btn primary" style="width:100%;">Register</button>
            <p style="margin-top:1rem;">Have an account? <a href="#" id="switchLogin" style="color:#00f2ff;">Login</a></p>
          `}
        </div>
      </div>
    `;
    document.getElementById('appRoot').innerHTML = html;
    
    if(showingLogin) {
      document.getElementById('doLogin').onclick = () => {
        const result = loginUser(document.getElementById('loginUser').value, document.getElementById('loginPass').value);
        if(result.success) renderApp();
        else { loginError = result.message; renderAuth(); }
      };
      document.getElementById('switchReg').onclick = (e) => { e.preventDefault(); showingLogin = false; registerError = ""; renderAuth(); };
    } else {
      document.getElementById('doReg').onclick = () => {
        const user = document.getElementById('regUser').value;
        const pass = document.getElementById('regPass').value;
        const confirm = document.getElementById('regConfirm').value;
        if(pass !== confirm) { registerError = "Passwords don't match!"; renderAuth(); return; }
        const result = registerUser(user, pass);
        if(result.success) { showingLogin = true; renderAuth(); }
        else { registerError = result.message; renderAuth(); }
      };
      document.getElementById('switchLogin').onclick = (e) => { e.preventDefault(); showingLogin = true; loginError = ""; renderAuth(); };
    }
  }
  
  // ==================== RENDER DASHBOARD ====================
  function renderDashboard() {
    if(!currentUser) return;
    const progress = getStakeProgress();
    const active = currentUser.activeStake;
    
    let stakeHtml = `<div>💎 No active stake</div>`;
    if(active) {
      const remaining = active.lockEndTime - Date.now();
      const hours = Math.floor(remaining / 3600000);
      const mins = Math.floor((remaining % 3600000) / 60000);
      const secs = Math.floor((remaining % 60000) / 1000);
      const reward = calculateReward(active.amount, active.seconds);
      stakeHtml = `
        <div style="background:#1a1f30; border-radius:1rem; height:8px;"><div style="width:${progress}%; height:100%; background:#00f2ff; border-radius:1rem;"></div></div>
        <div>⏱️ ${active.optionName}: ${hours}h ${mins}m ${secs}s | Reward: ${reward.toFixed(4)} BRD</div>
      `;
    }
    
    const stakingHtml = stakingOptions.map(opt => `
      <div style="background:#0a0e1f; padding:0.8rem; margin-bottom:0.5rem; border-left:3px solid #a855f7;">
        <strong>${opt.name}</strong> <span style="color:#00f2ff;">50% APR</span>
        <div>Min: ${opt.minStake} BRD</div>
        <input type="number" id="stakeAmt_${opt.name.replace(/\s/g,'')}" class="cyber-input" placeholder="Amount">
        <button class="stakeBtn" data-seconds="${opt.seconds}" data-name="${opt.name}" style="width:100%; margin-top:0.5rem;" class="cyber-btn">Stake ${opt.name}</button>
      </div>
    `).join('');
    
    const transactions = currentUser.transactions || [];
    const historyHtml = transactions.length === 0 ? '<tr><td colspan="3" style="text-align:center;">No transactions yet</td></tr>' :
      transactions.map(t => `<tr><td>${t.date}</td><td>${t.type}</td><td>${t.details}</td><td>${t.amount?.toLocaleString() || 0} BRD</td></tr>`).join('');
    
    const html = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; padding:1rem; background:rgba(12,20,35,0.7); border-radius:2rem;">
        <h1><i class="fas fa-microchip"></i> BRADICOIN RESERVE</h1>
        <div>
          <span><i class="fas fa-user"></i> ${currentUser.username}</span>
          <button id="logoutBtn" class="cyber-btn" style="margin-left:1rem;">Logout</button>
        </div>
      </div>
      
      <div class="dashboard-grid">
        <div class="neon-card">
          <h3>Balance</h3>
          <div class="balance-amount" id="balanceDisplay">${currentUser.balance.toLocaleString()}</div>
          <div>BRD TOKEN</div>
          <div style="margin-top:1rem;"><strong>Wallet Address</strong></div>
          <div style="font-family:monospace; font-size:0.7rem; background:#000; padding:0.5rem; border-radius:0.5rem; word-break:break-all;">${currentUser.walletAddress}</div>
          <button id="copyAddr" class="cyber-btn" style="width:100%; margin-top:0.5rem;">Copy Address</button>
          <button id="checkBalance" class="cyber-btn" style="width:100%; margin-top:0.5rem;">Check Balance on Blockchain</button>
        </div>
        
        <div class="neon-card">
          <h3>Staking (50% APR)</h3>
          ${stakingHtml}
          <div id="stakeStatus" class="status-msg"></div>
          ${stakeHtml}
          <button id="unstakeBtn" class="cyber-btn" style="width:100%; margin-top:0.5rem;">Unstake</button>
        </div>
        
        <div class="neon-card">
          <h3>Send / Receive</h3>
          <input type="text" id="recipientAddr" class="cyber-input" placeholder="Recipient Address (Br...)">
          <input type="number" id="sendAmount" class="cyber-input" placeholder="Amount BRD">
          <button id="sendBtn" class="cyber-btn primary" style="width:100%;">Send BRD</button>
          <hr style="margin: 1rem 0; border-color:#a855f7;">
          <input type="number" id="receiveAmount" class="cyber-input" placeholder="Amount to receive">
          <button id="receiveBtn" class="cyber-btn" style="width:100%;">Receive (Simulate)</button>
          <div id="txStatus" class="status-msg"></div>
        </div>
      </div>
      
      <div class="neon-card">
        <h3><i class="fas fa-history"></i> Transaction History</h3>
        <div style="max-height:300px; overflow-y:auto;">
          <table class="history-table">
            <thead><tr><th>Date/Time</th><th>Type</th><th>Details</th><th>Amount</th></tr></thead>
            <tbody>${historyHtml}</tbody>
          </table>
        </div>
      </div>
      
      <footer style="text-align:center; margin-top:1rem; font-size:0.7rem;">BRADICOIN RESERVE ● 50% APR ● Real Blockchain</footer>
    `;
    
    document.getElementById('appRoot').innerHTML = html;
    
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('copyAddr').onclick = copyAddress;
    document.getElementById('checkBalance').onclick = consultarSaldo;
    document.getElementById('sendBtn').onclick = () => enviarBRD(document.getElementById('recipientAddr').value, parseFloat(document.getElementById('sendAmount').value));
    document.getElementById('receiveBtn').onclick = () => receiveFunds(parseFloat(document.getElementById('receiveAmount').value));
    document.getElementById('unstakeBtn').onclick = unstake;
    
    document.querySelectorAll('.stakeBtn').forEach(btn => {
      btn.onclick = () => {
        const secs = parseInt(btn.dataset.seconds);
        const name = btn.dataset.name;
        const amount = parseFloat(document.getElementById(`stakeAmt_${name.replace(/\s/g,'')}`).value);
        const option = stakingOptions.find(o => o.seconds === secs);
        if(option && amount > 0) stake(amount, option);
        else showStatus("Enter valid amount", 'stakeStatus');
      };
    });
    
    setInterval(() => updateBalanceDisplay(), 1000);
  }
  
  function renderApp() { loadUsers(); loadCurrentSession(); if(currentUser) renderDashboard(); else renderAuth(); }
  renderApp();
</script>
</body>
</html>
