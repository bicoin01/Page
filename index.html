<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bradicoin Reserve Fund | BRD Token | Premium Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Orbitron', monospace;
      background: linear-gradient(135deg, #0a0f1e 0%, #03050b 100%);
      color: #e0e5ff;
      min-height: 100vh;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 50%, rgba(168, 85, 247, 0.15), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: 0;
      right: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 80% 80%, rgba(0, 242, 255, 0.1), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    .container { max-width: 1440px; margin: 0 auto; position: relative; z-index: 1; }
    .glass-card {
      background: rgba(10, 15, 30, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 20px rgba(168, 85, 247, 0.2);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .glass-card:hover {
      border-color: rgba(0, 242, 255, 0.6);
      box-shadow: 0 12px 48px rgba(0, 242, 255, 0.25);
      transform: translateY(-5px);
    }
    .btn {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(0, 242, 255, 0.1));
      border: 1px solid rgba(168, 85, 247, 0.5);
      color: #e0e5ff;
      font-family: 'Orbitron', monospace;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    .btn:hover::before { width: 300px; height: 300px; }
    .btn:hover {
      background: linear-gradient(135deg, #a855f7, #00f2ff);
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(168, 85, 247, 0.4);
    }
    .btn-primary { background: linear-gradient(135deg, #a855f7, #3b82f6); border: none; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3); }
    .btn-success { background: linear-gradient(135deg, #00cc88, #00f2ff); border: none; box-shadow: 0 4px 15px rgba(0, 242, 255, 0.3); }
    .btn-outline { background: transparent; border: 1px solid #a855f7; }
    .btn-outline:hover { background: #a855f7; border-color: transparent; }
    .btn-bradichain { background: linear-gradient(135deg, #ff6b35, #f7931a); border: none; box-shadow: 0 4px 15px rgba(247, 147, 26, 0.3); }
    .btn-bradichain:hover { background: linear-gradient(135deg, #f7931a, #ff6b35); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(247, 147, 26, 0.5); }
    .btn-danger { background: linear-gradient(135deg, #ff3333, #cc0000); border: none; }
    .input {
      background: rgba(1, 5, 24, 0.8);
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 14px 18px;
      border-radius: 20px;
      color: #e0e5ff;
      font-family: 'Orbitron', monospace;
      width: 100%;
      outline: none;
      transition: all 0.3s ease;
      font-size: 14px;
    }
    .input:focus {
      border-color: #00f2ff;
      box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
      background: rgba(1, 5, 24, 1);
    }
    .header {
      background: rgba(10, 15, 30, 0.6);
      backdrop-filter: blur(12px);
      border-radius: 50px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 16px 32px;
      margin-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 50px; height: 50px;
      background: linear-gradient(135deg, #a855f7, #00f2ff);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.7); }
      50% { box-shadow: 0 0 0 10px rgba(168, 85, 247, 0); }
    }
    .logo h1 {
      font-size: 1.6rem;
      background: linear-gradient(135deg, #fff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .balance-card {
      text-align: center;
      padding: 30px;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(0, 242, 255, 0.05));
      border-radius: 28px;
      margin-bottom: 24px;
    }
    .balance-label { font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: #a855f7; }
    .balance-amount {
      font-size: 3.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #00f2ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      word-break: break-all;
    }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 24px; }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card-header {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(168, 85, 247, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-header i { color: #a855f7; font-size: 1.3rem; }
    .staking-item {
      background: rgba(1, 5, 24, 0.5);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      transition: all 0.3s ease;
      border-left: 3px solid #a855f7;
    }
    .staking-item:hover { background: rgba(168, 85, 247, 0.1); transform: translateX(5px); }
    .progress-container { background: rgba(255, 255, 255, 0.1); border-radius: 20px; height: 12px; overflow: hidden; margin: 12px 0; }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #a855f7, #00f2ff);
      border-radius: 20px;
      transition: width 0.5s ease;
      position: relative;
      overflow: hidden;
    }
    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 2s infinite;
    }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .wallet-box {
      background: rgba(1, 5, 24, 0.6);
      border-radius: 20px;
      padding: 16px;
      margin: 16px 0;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      border: 1px dashed rgba(168, 85, 247, 0.3);
    }
    .history-container { max-height: 350px; overflow-y: auto; border-radius: 20px; }
    .history-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .history-table th { padding: 12px; text-align: left; color: #a855f7; font-weight: 600; border-bottom: 1px solid rgba(168, 85, 247, 0.3); }
    .history-table td { padding: 12px; border-bottom: 1px solid rgba(168, 85, 247, 0.15); }
    .history-table tr:hover { background: rgba(168, 85, 247, 0.05); }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 600; }
    .badge-sent { background: rgba(255, 102, 102, 0.2); color: #ff6666; }
    .badge-received { background: rgba(102, 255, 102, 0.2); color: #66ff66; }
    .badge-stake { background: rgba(255, 170, 102, 0.2); color: #ffaa66; }
    .badge-reward { background: rgba(102, 255, 204, 0.2); color: #66ffcc; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0c1a; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 10px; }
    footer { text-align: center; padding: 24px; font-size: 11px; opacity: 0.6; border-top: 1px solid rgba(168, 85, 247, 0.2); margin-top: 32px; }
    .status-msg { font-size: 12px; margin-top: 12px; text-align: center; padding: 8px; border-radius: 12px; }
    .status-success { background: rgba(0, 255, 136, 0.1); color: #00ff88; }
    .status-error { background: rgba(255, 0, 85, 0.1); color: #ff0055; }
    .status-info { background: rgba(0, 200, 255, 0.1); color: #00ccff; }
    .inline-buttons { display: flex; gap: 12px; margin-top: 12px; }
    hr { border-color: rgba(168, 85, 247, 0.2); margin: 20px 0; }
    .search-wallet-section { margin-bottom: 24px; }
    .search-wallet-box { display: flex; gap: 12px; flex-wrap: wrap; }
    .search-wallet-box .input { flex: 1; }
    .result-box { margin-top: 15px; padding: 15px; border-radius: 20px; display: none; }
    .result-box.show { display: block; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .bradichain-badge { background: linear-gradient(135deg, #f7931a, #ff6b35); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; color: white; }
    .clear-data-btn { background: rgba(255, 0, 85, 0.2); border: 1px solid #ff0055; color: #ff0055; }
    .clear-data-btn:hover { background: #ff0055; color: white; }
  </style>
</head>
<body>
<div class="container" id="app"></div>

<script>
  // ==================== CONFIGURAÇÃO ====================
  const API_URL = 'https://bradicoin-api.onrender.com';
  const BRADICHAIN_URL = 'https://www.bradichain.com';
  const RESERVE_SUPPLY = 99999999999999999;
  
  let users = [];
  let currentUser = null;
  
  // ==================== FUNÇÕES DE ARMAZENAMENTO ====================
  function loadUsers() {
    const stored = localStorage.getItem('bradicoin_premium_data');
    if(stored) users = JSON.parse(stored);
    else users = [];
  }
  
  function saveUsers() {
    localStorage.setItem('bradicoin_premium_data', JSON.stringify(users));
  }
  
  function saveCurrentUser() {
    if(currentUser) {
      const index = users.findIndex(u => u.id === currentUser.id);
      if(index !== -1) users[index] = currentUser;
      saveUsers();
    }
  }
  
  // Limpar todos os dados
  function clearAllData() {
    if(confirm('⚠️ ATENÇÃO! Isso irá apagar TODOS os usuários e dados. Você tem certeza?')) {
      localStorage.removeItem('bradicoin_premium_data');
      localStorage.removeItem('bradicoin_premium_session');
      users = [];
      currentUser = null;
      alert('✅ Todos os dados foram limpos! Você pode criar novas contas.');
      render();
    }
  }
  
  // ==================== GERADOR DE WALLET ====================
  function generateWalletAddress() {
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    let random = '';
    for(let i = 0; i < 40; i++) random += chars[Math.floor(Math.random() * chars.length)];
    return `Br${random}`;
  }
  
  function generateSeedPhrase() {
    const words = ["abandon","ability","able","about","above","absent","absorb","abstract","absurd","abuse","access","accident","account","accuse","achieve","acid","acoustic","acquire","across","act","action","actor","actress","actual","adapt","add","addict","address","adjust","admit","adult","advance","advice","aerobic","affair","afford","afraid","africa","after","again","age","agent","agree","ahead","aim","air","airport","aisle","alarm","album","alcohol","alert","alien","all","alley","allow","almost","alone","alpha","already","also","alter","always","amazing","among","amount","amuse","angel","anger","angle","angry","animal","ankle","announce","annual","another","answer","antenna","antique","anxiety","any","apart","apology","appear","apple","approve","april"];
    let seed = [];
    for(let i = 0; i < 12; i++) seed.push(words[Math.floor(Math.random() * words.length)]);
    return seed.join(' ');
  }
  
  // ==================== REGISTRO E LOGIN ====================
  function registerUser(username, password) {
    if(users.length >= 3) return { success: false, message: '⚠️ Maximum 3 users allowed' };
    if(users.find(u => u.username === username)) return { success: false, message: '⚠️ Username already exists' };
    if(username.length < 3) return { success: false, message: '⚠️ Username must be at least 3 characters' };
    if(password.length < 4) return { success: false, message: '⚠️ Password must be at least 4 characters' };
    
    const newUser = {
      id: Date.now(),
      username: username,
      password: password,
      walletAddress: generateWalletAddress(),
      seedPhrase: generateSeedPhrase(),
      balance: RESERVE_SUPPLY,
      activeStake: null,
      transactions: [],
      createdAt: new Date().toISOString()
    };
    
    users.push(newUser);
    saveUsers();
    
    fetch(`${API_URL}/api/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    }).catch(e => console.log('API note:', e));
    
    return { success: true, message: '✅ Account created successfully!', wallet: newUser.walletAddress };
  }
  
  function loginUser(username, password) {
    const user = users.find(u => u.username === username && u.password === password);
    if(user) {
      currentUser = user;
      localStorage.setItem('bradicoin_premium_session', JSON.stringify({ id: user.id }));
      return { success: true };
    }
    return { success: false, message: '❌ Invalid username or password' };
  }
  
  function logout() {
    currentUser = null;
    localStorage.removeItem('bradicoin_premium_session');
    render();
  }
  
  function loadSession() {
    const saved = localStorage.getItem('bradicoin_premium_session');
    if(saved) {
      const session = JSON.parse(saved);
      const user = users.find(u => u.id === session.id);
      if(user) currentUser = user;
    }
  }
  
  // ==================== TRANSAÇÕES ====================
  function addTransaction(type, details, amount, address = null) {
    if(!currentUser) return;
    if(!currentUser.transactions) currentUser.transactions = [];
    
    const now = new Date();
    const dateStr = now.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    
    currentUser.transactions.unshift({
      id: Date.now(),
      type: type,
      details: details,
      amount: amount,
      address: address,
      date: dateStr,
      timestamp: now.getTime()
    });
    
    if(currentUser.transactions.length > 50) currentUser.transactions.pop();
    saveCurrentUser();
  }
  
  // ==================== CONSULTAR WALLET (BRADICHAIN + API) ====================
  async function consultarWalletBradichain() {
    const address = document.getElementById('searchWalletAddress').value.trim();
    const resultDiv = document.getElementById('searchResult');
    
    if (!address) {
      showStatus('📌 Enter a wallet address to consult', 'searchStatus', 'error');
      return;
    }
    
    resultDiv.innerHTML = '<div style="text-align: center; color: #00ccff;">🔍 Consulting Bradichain blockchain...</div>';
    resultDiv.classList.add('show');
    
    try {
      const response = await fetch(`${API_URL}/api/balance/${address}`);
      const data = await response.json();
      
      let balance = 0;
      let found = false;
      
      if (data && data.success && data.data) {
        balance = data.data.balance;
        found = true;
      }
      
      resultDiv.innerHTML = `
        <div style="background: linear-gradient(135deg, rgba(0,255,100,0.1), rgba(0,200,255,0.05)); border: 2px solid ${found ? '#00ff66' : '#ffc800'}; border-radius: 20px; padding: 20px;">
          <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; margin-bottom: 15px;">
            <div>
              <span class="badge" style="background: ${found ? '#00ff66' : '#ffc800'}; color: #000;">${found ? '✅ WALLET FOUND' : '⚠️ WALLET NOT FOUND'}</span>
              <span class="badge" style="background: #f7931a; color: #fff; margin-left: 10px;"><i class="fas fa-link"></i> Bradichain Mainnet</span>
            </div>
            <button onclick="openBradichainExplorer('${address}')" class="btn btn-bradichain" style="padding: 8px 16px; font-size: 12px;">
              <i class="fas fa-external-link-alt"></i> Open on Bradichain
            </button>
          </div>
          <div class="metric-row"><span class="metric-label">📍 Wallet Address:</span><span class="metric-value" style="font-family: monospace; font-size: 12px; word-break: break-all;">${address}</span></div>
          <div class="metric-row"><span class="metric-label">💰 Current Balance:</span><span class="metric-value" style="color: #00ff66; font-size: 1.5rem; font-weight: bold;">${balance.toLocaleString()} BRD</span></div>
          <div class="metric-row"><span class="metric-label">💎 Currency:</span><span class="metric-value">BRD (Bradicoin)</span></div>
          <div class="metric-row"><span class="metric-label">🔗 Network:</span><span class="metric-value">Bradichain Mainnet</span></div>
          <div class="metric-row"><span class="metric-label">⏱️ Last Check:</span><span class="metric-value">${new Date().toLocaleString()}</span></div>
          <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(0,255,100,0.2); display: flex; gap: 10px; flex-wrap: wrap;">
            <button onclick="copyToClipboardManual('${address}')" class="btn btn-outline" style="padding: 8px 16px; font-size: 12px;"><i class="fas fa-copy"></i> Copy Address</button>
            <button onclick="openBradichainExplorer('${address}')" class="btn btn-bradichain" style="padding: 8px 16px; font-size: 12px;"><i class="fas fa-chart-line"></i> View Transactions</button>
          </div>
        </div>
      `;
      showStatus(`✅ Wallet consultation completed`, 'searchStatus', 'success');
    } catch (error) {
      resultDiv.innerHTML = `
        <div style="background: rgba(255,100,100,0.1); border: 2px solid #ff6464; border-radius: 20px; padding: 20px; text-align: center;">
          <div style="font-size: 48px;">❌</div>
          <h3 style="color: #ff6464;">Connection Error</h3>
          <p>Could not connect to Bradicoin API.</p>
          <button onclick="openBradichainExplorer('${address}')" class="btn btn-bradichain" style="margin-top: 15px;">🌐 Open Bradichain Explorer</button>
        </div>
      `;
      showStatus(`❌ API connection error`, 'searchStatus', 'error');
    }
  }
  
  function openBradichainExplorer(address) {
    const url = `${BRADICHAIN_URL}/address/${address}`;
    window.open(url, '_blank');
    showStatus(`🔍 Opening ${url}`, 'searchStatus', 'info');
  }
  
  function copyToClipboardManual(text) {
    navigator.clipboard.writeText(text);
    showStatus(`📋 Address copied to clipboard!`, 'searchStatus', 'success');
  }
  
  // ==================== API ====================
  async function checkBalanceOnChain() {
    if(!currentUser) return;
    showStatus('🔍 Consulting blockchain...', 'status', 'info');
    try {
      const response = await fetch(`${API_URL}/api/balance/${currentUser.walletAddress}`);
      const data = await response.json();
      if(data.success && data.data) {
        currentUser.balance = data.data.balance;
        saveCurrentUser();
        showStatus(`✅ Balance: ${currentUser.balance.toLocaleString()} BRD`, 'status', 'success');
        renderDashboard();
      } else {
        showStatus(`⚠️ ${data.error || 'Wallet not found on chain'}`, 'status', 'error');
      }
    } catch(error) {
      showStatus(`⚠️ Using local balance`, 'status', 'error');
    }
  }
  
  async function sendBRD(toAddress, amount) {
    if(!currentUser) return;
    if(!toAddress) { showStatus('📍 Enter destination address', 'sendStatus', 'error'); return; }
    if(amount <= 0) { showStatus('💰 Invalid amount', 'sendStatus', 'error'); return; }
    if(amount > currentUser.balance) { showStatus('⚠️ Insufficient balance', 'sendStatus', 'error'); return; }
    
    showStatus(`⏳ Sending ${amount} BRD...`, 'sendStatus', 'info');
    try {
      const response = await fetch(`${API_URL}/api/send`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fromAddress: currentUser.walletAddress,
          toAddress: toAddress,
          amount: amount
        })
      });
      const result = await response.json();
      
      if(result.success) {
        currentUser.balance = result.data?.newBalance || (currentUser.balance - amount);
        const bonus = result.data?.bonus || 0;
        saveCurrentUser();
        addTransaction('SENT', `Sent to ${toAddress.substring(0, 20)}...`, amount, toAddress);
        if(bonus > 0) addTransaction('BONUS', `Auto-repletion bonus (∞ Reserve Fund)`, bonus, null);
        showStatus(`✅ ${result.message}`, 'sendStatus', 'success');
        renderDashboard();
      } else {
        showStatus(`❌ ${result.error}`, 'sendStatus', 'error');
      }
    } catch(error) {
      showStatus(`❌ Error: ${error.message}`, 'sendStatus', 'error');
    }
  }
  
  // ==================== STAKING ====================
  const stakeOptions = [
    { name: "30 Minutes", seconds: 1800, minStake: 50, apr: 50, icon: "⏱️" },
    { name: "1 Hour", seconds: 3600, minStake: 100, apr: 50, icon: "⌛" },
    { name: "1 Day", seconds: 86400, minStake: 500, apr: 50, icon: "📅" }
  ];
  
  function calcReward(amount, seconds) {
    return amount * (0.50 * (seconds / 31536000));
  }
  
  function doStake(amount, option) {
    if(!currentUser) return;
    if(amount <= 0 || amount > currentUser.balance) { showStatus('💰 Invalid amount', 'stakeStatus', 'error'); return; }
    if(amount < option.minStake) { showStatus(`⚠️ Minimum ${option.minStake} BRD`, 'stakeStatus', 'error'); return; }
    if(currentUser.activeStake && currentUser.activeStake.endTime > Date.now()) {
      showStatus('🔒 You have an active stake!', 'stakeStatus', 'error');
      return;
    }
    
    if(currentUser.activeStake && currentUser.activeStake.endTime <= Date.now()) {
      const reward = calcReward(currentUser.activeStake.amount, currentUser.activeStake.seconds);
      currentUser.balance += currentUser.activeStake.amount + reward;
      addTransaction('STAKE_REWARD', `Staking reward (${currentUser.activeStake.name})`, reward, null);
    }
    
    currentUser.activeStake = {
      amount: amount,
      seconds: option.seconds,
      name: option.name,
      endTime: Date.now() + (option.seconds * 1000),
      startTime: Date.now()
    };
    currentUser.balance -= amount;
    addTransaction('STAKE', `Staked ${amount} BRD for ${option.name}`, amount, null);
    saveCurrentUser();
    renderDashboard();
    showStatus(`✅ Staked ${amount} BRD for ${option.name}!`, 'stakeStatus', 'success');
  }
  
  function doUnstake() {
    if(!currentUser || !currentUser.activeStake) { showStatus('🔓 No active stake', 'stakeStatus', 'error'); return; }
    if(Date.now() < currentUser.activeStake.endTime) { showStatus('⏰ Stake still locked!', 'stakeStatus', 'error'); return; }
    
    const reward = calcReward(currentUser.activeStake.amount, currentUser.activeStake.seconds);
    currentUser.balance += currentUser.activeStake.amount + reward;
    addTransaction('UNSTAKE', `Unstaked ${currentUser.activeStake.amount} BRD`, currentUser.activeStake.amount, null);
    addTransaction('STAKE_REWARD', `Staking reward earned`, reward, null);
    currentUser.activeStake = null;
    saveCurrentUser();
    renderDashboard();
    showStatus(`✅ Unstaked! Received +${reward.toFixed(4)} BRD reward`, 'stakeStatus', 'success');
  }
  
  function getStakeProgress() {
    if(!currentUser || !currentUser.activeStake) return 0;
    const total = currentUser.activeStake.seconds * 1000;
    const elapsed = Date.now() - currentUser.activeStake.startTime;
    return Math.min(100, (elapsed / total) * 100);
  }
  
  function getTimeRemaining() {
    if(!currentUser || !currentUser.activeStake) return null;
    const remaining = currentUser.activeStake.endTime - Date.now();
    if(remaining <= 0) return '🎉 Matured! Ready to unstake';
    const hours = Math.floor(remaining / 3600000);
    const mins = Math.floor((remaining % 3600000) / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    return `${hours}h ${mins}m ${secs}s`;
  }
  
  function simulateReceive(amount) {
    if(!currentUser) return;
    if(!amount || amount <= 0) { showStatus('💰 Invalid amount', 'sendStatus', 'error'); return; }
    currentUser.balance += amount;
    addTransaction('RECEIVED', `Received from external wallet`, amount, null);
    saveCurrentUser();
    renderDashboard();
    showStatus(`✅ Received ${amount} BRD!`, 'sendStatus', 'success');
  }
  
  function lookupOnBradichain() {
    if(!currentUser) return;
    const url = `${BRADICHAIN_URL}/address/${currentUser.walletAddress}`;
    window.open(url, '_blank');
    showStatus('🔍 Opening Bradichain Explorer...', 'status', 'info');
  }
  
  function showStatus(msg, elementId, type = 'info') {
    const el = document.getElementById(elementId);
    if(el) {
      el.innerHTML = msg;
      el.className = `status-msg status-${type}`;
      setTimeout(() => {
        if(el.innerHTML === msg) el.innerHTML = '';
      }, 5000);
    }
  }
  
  // ==================== RENDER ====================
  let showLogin = true;
  let loginError = '', regError = '';
  
  function renderAuth() {
    const html = `
      <div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <div class="glass-card" style="max-width: 480px; width: 100%; padding: 40px; text-align: center;">
          <div class="logo-icon" style="margin: 0 auto 20px; width: 80px; height: 80px; font-size: 40px;">💰</div>
          <h1 style="font-size: 1.8rem; margin-bottom: 10px;">BRADICOIN</h1>
          <p style="color: #a855f7; margin-bottom: 20px;">RESERVE FUND</p>
          <p style="color: #00f2ff; font-size: 12px; margin-bottom: 30px;">💎 Total Reserve: ${RESERVE_SUPPLY.toLocaleString()} BRD</p>
          <p style="color: #ffaa66; font-size: 11px; margin-bottom: 20px;">👥 Users: ${users.length}/3 registered</p>
          
          ${showLogin ? `
            <input type="text" id="loginUser" class="input" placeholder="Username" style="margin-bottom: 16px;">
            <input type="password" id="loginPass" class="input" placeholder="Password" style="margin-bottom: 16px;">
            <div id="loginMsg" class="status-msg status-error" style="margin-bottom: 16px;">${loginError}</div>
            <button id="doLogin" class="btn btn-primary" style="width: 100%;">🔐 Sign In</button>
            <p style="margin-top: 24px; font-size: 13px;">No account? <a href="#" id="switchReg" style="color: #00f2ff;">Create Account</a></p>
          ` : `
            <input type="text" id="regUser" class="input" placeholder="Username" style="margin-bottom: 16px;">
            <input type="password" id="regPass" class="input" placeholder="Password" style="margin-bottom: 16px;">
            <input type="password" id="regConfirm" class="input" placeholder="Confirm Password" style="margin-bottom: 16px;">
            <div id="regMsg" class="status-msg status-error" style="margin-bottom: 16px;">${regError}</div>
            <button id="doReg" class="btn btn-primary" style="width: 100%;">📝 Register</button>
            <p style="margin-top: 24px; font-size: 13px;">Already have an account? <a href="#" id="switchLogin" style="color: #00f2ff;">Sign In</a></p>
          `}
          
          <hr style="margin: 30px 0 20px 0;">
          <button id="clearDataBtn" class="btn clear-data-btn" style="width: 100%;"><i class="fas fa-trash-alt"></i> Clear All Data (Reset)</button>
          <p style="font-size: 10px; margin-top: 15px; color: #888;">⚠️ This will delete all accounts and create new ones</p>
        </div>
      </div>
    `;
    document.getElementById('app').innerHTML = html;
    
    if(showLogin) {
      document.getElementById('doLogin').onclick = () => {
        const result = loginUser(document.getElementById('loginUser').value, document.getElementById('loginPass').value);
        if(result.success) render();
        else { loginError = result.message; renderAuth(); }
      };
      document.getElementById('switchReg').onclick = (e) => { e.preventDefault(); showLogin = false; regError = ''; renderAuth(); };
    } else {
      document.getElementById('doReg').onclick = () => {
        const user = document.getElementById('regUser').value;
        const pass = document.getElementById('regPass').value;
        const confirm = document.getElementById('regConfirm').value;
        if(pass !== confirm) { regError = "Passwords don't match!"; renderAuth(); return; }
        const result = registerUser(user, pass);
        if(result.success) { showLogin = true; renderAuth(); }
        else { regError = result.message; renderAuth(); }
      };
      document.getElementById('switchLogin').onclick = (e) => { e.preventDefault(); showLogin = true; loginError = ''; renderAuth(); };
    }
    
    document.getElementById('clearDataBtn').onclick = clearAllData;
  }
  
  function renderDashboard() {
    if(!currentUser) return;
    
    const progress = getStakeProgress();
    const timeLeft = getTimeRemaining();
    const activeStake = currentUser.activeStake;
    const reward = activeStake ? calcReward(activeStake.amount, activeStake.seconds).toFixed(4) : 0;
    
    let stakeHtml = `<div style="text-align: center; padding: 20px;">💎 No active stake</div>`;
    if(activeStake) {
      stakeHtml = `
        <div class="progress-container"><div class="progress-fill" style="width: ${progress}%"></div></div>
        <div style="text-align: center; margin-top: 12px;">
          <div><strong>🔒 ${activeStake.amount.toLocaleString()} BRD staked</strong></div>
          <div style="font-size: 12px; margin-top: 5px;">⏱️ ${activeStake.name} - ${timeLeft}</div>
          <div style="font-size: 11px; color: #00f2ff; margin-top: 5px;">🎁 Expected reward: ${reward} BRD (50% APR)</div>
        </div>
      `;
    }
    
    const stakeOptionsHtml = stakeOptions.map(opt => `
      <div class="staking-item">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div><span style="font-size: 20px;">${opt.icon}</span> <strong>${opt.name}</strong></div>
          <span class="badge" style="background: linear-gradient(135deg, #a855f7, #3b82f6); color: white;">${opt.apr}% APR</span>
        </div>
        <div style="font-size: 11px; margin: 8px 0;">Minimum: ${opt.minStake} BRD</div>
        <input type="number" id="stakeAmt_${opt.name.replace(/\s/g,'')}" class="input" placeholder="Amount to stake" style="margin: 8px 0; padding: 10px;">
        <button class="btn btn-outline stakeBtn" data-seconds="${opt.seconds}" data-name="${opt.name}" style="width: 100%;">🔒 Stake ${opt.name}</button>
      </div>
    `).join('');
    
    const transactions = currentUser.transactions || [];
    const historyHtml = transactions.length === 0 
      ? '<tr><td colspan="4" style="text-align: center; padding: 40px;">✨ No transactions yet</td></tr>'
      : transactions.map(t => `
        <tr>
          <td style="font-size: 11px;">${t.date}</td>
          <td><span class="badge badge-${t.type.toLowerCase()}">${t.type}</span></td>
          <td style="font-size: 11px;">${t.details}</td>
          <td>${t.amount?.toLocaleString() || 0} BRD</td>
        </tr>
      `).join('');
    
    const html = `
      <div class="header">
        <div class="logo">
          <div class="logo-icon">💰</div>
          <h1>BRADICOIN RESERVE</h1>
        </div>
        <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
          <span><i class="fas fa-user"></i> ${currentUser.username}</span>
          <button id="logoutBtn" class="btn btn-outline" style="padding: 8px 20px;">🚪 Logout</button>
        </div>
      </div>
      
      <!-- Search Wallet Section -->
      <div class="glass-card search-wallet-section" style="padding: 24px; margin-bottom: 24px;">
        <div class="card-header"><i class="fas fa-search"></i> Consult Wallet on Bradichain <span class="bradichain-badge"><i class="fas fa-link"></i> Bradichain.com</span></div>
        <div class="search-wallet-box">
          <input type="text" id="searchWalletAddress" class="input" placeholder="Enter Bradicoin wallet address (Br...)" style="flex: 1;">
          <button id="consultWalletBtn" class="btn btn-bradichain"><i class="fas fa-search"></i> Consult</button>
          <button id="openExplorerBtn" class="btn btn-outline"><i class="fas fa-external-link-alt"></i> Open Explorer</button>
        </div>
        <div id="searchResult" class="result-box"></div>
        <div id="searchStatus" class="status-msg"></div>
      </div>
      
      <div class="balance-card glass-card">
        <div class="balance-label">TOTAL BALANCE</div>
        <div class="balance-amount">${currentUser.balance.toLocaleString()} <span style="font-size: 1rem;">BRD</span></div>
        <div style="font-size: 11px; margin-top: 8px;">💎 Reserve Fund: ${RESERVE_SUPPLY.toLocaleString()} BRD</div>
      </div>
      
      <div class="grid">
        <div class="glass-card" style="padding: 24px;">
          <div class="card-header"><i class="fas fa-wallet"></i> My Wallet</div>
          <div class="wallet-box">
            <div style="font-size: 11px; color: #a855f7; margin-bottom: 8px;">📌 ADDRESS</div>
            <div style="font-family: monospace; font-size: 11px; word-break: break-all;">${currentUser.walletAddress}</div>
          </div>
          <div class="inline-buttons">
            <button id="copyAddressBtn" class="btn btn-outline" style="flex: 1; padding: 10px;">📋 Copy</button>
            <button id="lookupChainBtn" class="btn btn-bradichain" style="flex: 1; padding: 10px;"><i class="fas fa-link"></i> Explorer</button>
          </div>
          <button id="checkChainBtn" class="btn btn-primary" style="width: 100%; margin-top: 12px;">🔄 Sync with Blockchain</button>
          <div class="wallet-box" style="margin-top: 16px;">
            <div style="font-size: 11px; color: #a855f7; margin-bottom: 8px;">🔐 SEED PHRASE (12 words)</div>
            <div style="font-family: monospace; font-size: 10px; word-break: break-all;">${currentUser.seedPhrase}</div>
          </div>
        </div>
        
        <div class="glass-card" style="padding: 24px;">
          <div class="card-header"><i class="fas fa-lock"></i> Staking Pools</div>
          ${stakeOptionsHtml}
          <div id="stakeStatus" class="status-msg"></div>
          <hr>
          ${stakeHtml}
          <button id="unstakeBtn" class="btn btn-primary" style="width: 100%; margin-top: 16px;">🔓 Unstake & Claim Rewards</button>
        </div>
        
        <div class="glass-card" style="padding: 24px;">
          <div class="card-header"><i class="fas fa-exchange-alt"></i> Send / Receive</div>
          <input type="text" id="sendTo" class="input" placeholder="📍 Recipient Address (Br...)" style="margin-bottom: 12px;">
          <input type="number" id="sendAmount" class="input" placeholder="💰 Amount (BRD)" style="margin-bottom: 12px;">
          <button id="sendBtn" class="btn btn-primary" style="width: 100%;">✈️ Send BRD</button>
          <div id="sendStatus" class="status-msg"></div>
          
          <hr>
          
          <input type="number" id="receiveAmount" class="input" placeholder="💰 Amount to receive" style="margin-bottom: 12px;">
          <button id="receiveBtn" class="btn btn-success" style="width: 100%;">📥 Receive (Simulate)</button>
        </div>
      </div>
      
      <div class="glass-card" style="padding: 24px;">
        <div class="card-header"><i class="fas fa-history"></i> Transaction History</div>
        <div class="history-container">
          <table class="history-table">
            <thead><tr><th>Date/Time</th><th>Type</th><th>Details</th><th>Amount</th></tr></thead>
            <tbody>${historyHtml}</tbody>
          </table>
        </div>
      </div>
      
      <footer>
        <i class="fas fa-shield-alt"></i> BRADICOIN RESERVE FUND | 50% APR | ∞ Auto-Repletion | Max 3 Users | Powered by Bradichain
      </footer>
    `;
    
    document.getElementById('app').innerHTML = html;
    
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('copyAddressBtn').onclick = () => {
      navigator.clipboard.writeText(currentUser.walletAddress);
      showStatus('📋 Address copied!', 'sendStatus', 'success');
    };
    document.getElementById('lookupChainBtn').onclick = lookupOnBradichain;
    document.getElementById('checkChainBtn').onclick = checkBalanceOnChain;
    document.getElementById('sendBtn').onclick = () => sendBRD(document.getElementById('sendTo').value, parseFloat(document.getElementById('sendAmount').value));
    document.getElementById('receiveBtn').onclick = () => simulateReceive(parseFloat(document.getElementById('receiveAmount').value));
    document.getElementById('unstakeBtn').onclick = doUnstake;
    document.getElementById('consultWalletBtn').onclick = consultarWalletBradichain;
    document.getElementById('openExplorerBtn').onclick = () => {
      const address = document.getElementById('searchWalletAddress').value.trim();
      if(address) openBradichainExplorer(address);
      else showStatus('📌 Enter a wallet address first', 'searchStatus', 'error');
    };
    document.getElementById('searchWalletAddress').addEventListener('keypress', (e) => {
      if(e.key === 'Enter') consultarWalletBradichain();
    });
    
    document.querySelectorAll('.stakeBtn').forEach(btn => {
      btn.onclick = () => {
        const seconds = parseInt(btn.dataset.seconds);
        const name = btn.dataset.name;
        const amount = parseFloat(document.getElementById(`stakeAmt_${name.replace(/\s/g,'')}`).value);
        const option = stakeOptions.find(o => o.seconds === seconds);
        if(option && amount > 0) doStake(amount, option);
        else showStatus('💰 Enter a valid amount', 'stakeStatus', 'error');
      };
    });
  }
  
  function render() {
    loadUsers();
    loadSession();
    if(currentUser) renderDashboard();
    else renderAuth();
  }
  
  render();
</script>
</body>
</html>
