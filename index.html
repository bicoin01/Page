<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

      content: '';

    .btn-test-api { background: linear-gradient(135deg, rgba(0, 200, 255, 0.2), rgba(0, 100, 255, 0.1)); border: 1px solid rgba(0, 200, 255, 0.4); color: #00ccff; }
    .btn-test-api:hover { background: linear-gradient(135deg, #00ccff, #0088ff); border-color: transparent; color: #fff; }
    .btn-delete-users { background: linear-gradient(135deg, rgba(255, 0, 50, 0.2), rgba(200, 0, 50, 0.1)); border: 1px solid rgba(255, 0, 50, 0.4); color: #ff3355; }

    .input {
      background: rgba(1, 5, 24, 0.8);

    .input:focus {

    .header {
      background: rgba(10, 15, 30, 0.6);

    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 50px; height: 50px;
      background: linear-gradient(135deg, #a855f7, #00f2ff);
      border-radius: 18px;

    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.7); }
      50% { box-shadow: 0 0 0 10px rgba(168, 85, 247, 0); }
    }
    .logo h1 {
      font-size: 1.6rem;
      background: linear-gradient(135deg, #fff, #a855f7);

    .balance-amount {

    }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 24px; }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card-header {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(168, 85, 247, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-header i { color: #a855f7; font-size: 1.3rem; }
    .staking-item {
      background: rgba(1, 5, 24, 0.5);
      border-radius: 20px;

    .staking-item:hover { background: rgba(168, 85, 247, 0.1); transform: translateX(5px); }
    .progress-container { background: rgba(255, 255, 255, 0.1); border-radius: 20px; height: 12px; overflow: hidden; margin: 12px 0; }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #a855f7, #00f2ff);
      border-radius: 20px;
      transition: width 0.5s ease;
      position: relative;
      overflow: hidden;
    }
    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 2s infinite;
    }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .wallet-box {
      background: rgba(1, 5, 24, 0.6);
      border-radius: 20px;
      padding: 16px;
      margin: 16px 0;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      border: 1px dashed rgba(168, 85, 247, 0.3);
    }
    .status-msg { font-size: 12px; margin-top: 12px; text-align: center; padding: 8px; border-radius: 12px; }
    .status-success { background: rgba(0, 255, 136, 0.1); color: #00ff88; }
    .status-error { background: rgba(255, 0, 85, 0.1); color: #ff0055; }
    .status-info { background: rgba(0, 200, 255, 0.1); color: #00ccff; }
    .status-warning { background: rgba(255, 200, 0, 0.1); color: #ffcc00; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 600; }
    .badge-sent { background: rgba(255, 102, 102, 0.2); color: #ff6666; }
    .badge-received { background: rgba(102, 255, 102, 0.2); color: #66ff66; }
    .badge-stake { background: rgba(255, 170, 102, 0.2); color: #ffaa66; }
    .badge-reward { background: rgba(102, 255, 204, 0.2); color: #66ffcc; }
    .inline-buttons { display: flex; gap: 12px; margin-top: 12px; }
    .history-container { max-height: 350px; overflow-y: auto; border-radius: 20px; }
    .history-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .history-table th { padding: 12px; text-align: left; color: #a855f7; font-weight: 600; border-bottom: 1px solid rgba(168, 85, 247, 0.3); }
    .history-table td { padding: 12px; border-bottom: 1px solid rgba(168, 85, 247, 0.15); }
    .history-table tr:hover { background: rgba(168, 85, 247, 0.05); }
    .bradichain-badge { background: linear-gradient(135deg, #f7931a, #ff6b35); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; color: white; }
    .result-box { margin-top: 15px; padding: 15px; border-radius: 20px; display: none; }
    .result-box.show { display: block; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    footer { text-align: center; padding: 24px; font-size: 11px; opacity: 0.6; border-top: 1px solid rgba(168, 85, 247, 0.2); margin-top: 32px; }
    .reserve-card { background: linear-gradient(135deg, rgba(0,242,255,0.2), rgba(168,85,247,0.1)); border: 2px solid #00f2ff; }
    .user-balance-card { background: linear-gradient(135deg, rgba(0,255,136,0.15), rgba(0,242,255,0.08)); border: 2px solid #00ff88; }
    .metric-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .online { color: #00ff88; }
    .offline { color: #ff6666; }
    .network-status { font-size: 10px; padding: 4px 8px; border-radius: 12px; }
    .send-section { background: rgba(255, 215, 0, 0.05); border: 2px solid #ffd700; border-radius: 20px; padding: 20px; margin: 16px 0; }
    .send-section .card-header { border-bottom-color: rgba(255, 215, 0, 0.3); }
    .send-section .card-header i { color: #ffd700; }
    .wallet-select { background: rgba(1, 5, 24, 0.8); border: 1px solid #ffd700; padding: 12px; border-radius: 16px; color: #fff; font-family: monospace; width: 100%; font-size: 12px; }
    .wallet-select option { background: #0a0f1e; color: #fff; }
    .quick-amount { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .quick-amount .btn { padding: 6px 12px; font-size: 11px; }
    .success-animation { animation: successFlash 0.5s ease; }
    @keyframes successFlash { 0%, 100% { background: rgba(0, 255, 136, 0.1); } 50% { background: rgba(0, 255, 136, 0.3); } }
    .auth-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .auth-buttons .btn { width: 100%; justify-content: center; }
    .divider { border: none; border-top: 1px solid rgba(168, 85, 247, 0.2); margin: 20px 0; }
    .user-limit-msg { background: rgba(255, 200, 0, 0.15); border: 2px solid #ffcc00; border-radius: 16px; padding: 15px; margin-bottom: 16px; color: #ffcc00; text-align: center; font-weight: 600; }
    .storage-indicator { font-size: 10px; padding: 4px 8px; border-radius: 12px; background: rgba(0, 200, 255, 0.1); border: 1px solid rgba(0, 200, 255, 0.3); color: #00ccff; }
  </style>
</head>
<body>
<div class="container" id="app"></div>

<script>
  // ============================================================
  // CONFIGURATION
  // ============================================================
  const BRADICHAIN_URL = 'https://www.bradichain.com';
  const BRD_TO_USD = 10;
  const RESERVE_SUPPLY_BRD = 100000000000000000;
  const RESERVE_SUPPLY_USD = RESERVE_SUPPLY_BRD * BRD_TO_USD;
  const MAX_USERS = 2;
  
  const APR_2MIN = 130;
  const APR_30MIN = 130;
  const APR_1HOUR = 50;
  const APR_1DAY = 50;
  
  let users = [];
  let currentUser = null;
  let showLogin = true;
  let loginError = '';
  let regError = '';
  
  // ============================================================
  // HELPER: Format Large Numbers
  // ============================================================
  function formatNumber(num) {
    if (num === undefined || num === null || isNaN(num)) return '0';
    return Number(num).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }
  
  function formatNumberDecimal(num) {
    if (num === undefined || num === null || isNaN(num)) return '0';
    return Number(num).toLocaleString('en-US', { maximumFractionDigits: 4 });
  }
  
  // ============================================================
  // STORAGE FUNCTIONS - PERSISTÊNCIA LOCAL
  // ============================================================
  function loadUsers() {
    try {
      const stored = localStorage.getItem('bradicoin_premium_data');
      if(stored) {
        users = JSON.parse(stored);
        console.log('📊 Users loaded from localStorage:', users.length);
        
        // Garantir que todos os usuários tenham os campos necessários
        users = users.map(u => {
          if (!u.stakingHistory) u.stakingHistory = [];
          if (!u.transactions) u.transactions = [];
          if (!u.activeStake) u.activeStake = null;
          return u;
        });
        
        saveUsers();
      } else {
        users = [];
        const defaultUser = {
          id: Date.now(),
          username: 'Bradi10',
          password: '36124589Bdc',
          walletAddress: 'Br' + 'bradi10' + Math.random().toString(36).substring(2, 35),
          seedPhrase: generateSeedPhrase(),
          balance: 100000000000000000,
          activeStake: null,
          transactions: [],
          stakingHistory: [],
          createdAt: new Date().toISOString()
        };
        users.push(defaultUser);
        saveUsers();
        console.log('✅ Default user Bradi10 created with 100 Quadrillion BRD!');
      }
    } catch(e) {
      console.error('❌ Load users error:', e);
      users = [];
    }
  }
  
  function saveUsers() {
    try {
      localStorage.setItem('bradicoin_premium_data', JSON.stringify(users));
      console.log('💾 Users saved to localStorage:', users.length);
    } catch(e) {
      console.error('❌ Error saving users:', e);
    }
  }
  
  function saveCurrentUser() {
    if(currentUser) {
      const index = users.findIndex(u => u.id === currentUser.id);
      if(index !== -1) {
        users[index] = currentUser;
        saveUsers();
        console.log('💾 Current user saved:', currentUser.username);
      }
    }
  }
  
  // ============================================================
  // WALLET GENERATORS
  // ============================================================
  function generateWalletAddress() {
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    let random = '';
    for(let i = 0; i < 40; i++) {
      random += chars[Math.floor(Math.random() * chars.length)];
    }
    return `Br${random}`;
  }
  
  function generateSeedPhrase() {
    const words = ["abandon","ability","able","about","above","absent","absorb","abstract","absurd","abuse","access","accident","account","accuse","achieve","acid","acoustic","acquire","across","act","action","actor","actress","actual","adapt","add","addict","address","adjust","admit","adult","advance","advice","aerobic","affair","afford","afraid","africa","after","again","age","agent","agree","ahead","aim","air","airport","aisle","alarm","album","alcohol","alert","alien","all","alley","allow","almost","alone","alpha","already","also","alter","always","amazing","among","amount","amuse","angel","anger","angle","angry","animal","ankle","announce","annual","another","answer","antenna","antique","anxiety","any","apart","apology","appear","apple","approve","april"];
    let seed = [];
    for(let i = 0; i < 12; i++) {
      seed.push(words[Math.floor(Math.random() * words.length)]);
    }
    return seed.join(' ');
  }
  
  // ============================================================
  // REGISTER & LOGIN
  // ============================================================
  function registerUser(username, password) {
    console.log('📝 Registering user:', username);
    
    if (users.length >= MAX_USERS) {
      return { success: false, message: '⚠️ Número de usuário limitado para dois' };
    }
    
    if (users.find(u => u.username === username)) {
      return { success: false, message: '⚠️ Username already exists' };
    }
    
    if (username.length < 3) {
      return { success: false, message: '⚠️ Username must be at least 3 characters' };
    }
    if (password.length < 4) {
      return { success: false, message: '⚠️ Password must be at least 4 characters' };
    }
    
    const initialBalance = 100000000000000000;
    
    const newUser = {
      id: Date.now(),
      username: username,
      password: password,
      walletAddress: generateWalletAddress(),
      seedPhrase: generateSeedPhrase(),
      balance: initialBalance,
      activeStake: null,
      transactions: [],
      stakingHistory: [],
      createdAt: new Date().toISOString()
    };
    
    users.push(newUser);
    saveUsers();
    console.log('✅ User created:', newUser.walletAddress);
    
    return {
      success: true,
      message: '✅ Account created successfully!',
      wallet: newUser.walletAddress,
      balance: initialBalance
    };
  }
  
  function loginUser(username, password) {
    console.log('🔐 Trying login:', username);
    
    const user = users.find(u => u.username === username && u.password === password);
    if (!user) {
      console.log('❌ User not found');
      loginError = '❌ Invalid username or password';
      renderAuth();
      return { success: false, message: '❌ Invalid username or password' };
    }
    
    console.log('✅ User found:', user.username);
    
    user.balance = parseFloat(user.balance) || 100000000000000000;
    if (!user.transactions) user.transactions = [];
    if (!user.stakingHistory) user.stakingHistory = [];
    
    currentUser = user;
    localStorage.setItem('bradicoin_premium_session', JSON.stringify({ id: user.id }));
    
    console.log('✅ Login successful!');
    console.log('💰 Balance:', currentUser.balance);
    console.log('📊 Transactions:', currentUser.transactions.length);
    console.log('📊 Staking History:', currentUser.stakingHistory.length);
    
    renderDashboard();
    return { success: true };
  }
  
  function logout() {
    if (confirm('⚠️ Are you sure you want to logout?')) {
      currentUser = null;
      localStorage.removeItem('bradicoin_premium_session');
      console.log('🚪 Logout done');
      render();
    }
  }
  
  function loadSession() {
    try {
      const saved = localStorage.getItem('bradicoin_premium_session');
      if(saved) {
        const session = JSON.parse(saved);
        const user = users.find(u => u.id === session.id);
        if(user) {
          user.balance = parseFloat(user.balance) || 100000000000000000;
          if (!user.transactions) user.transactions = [];
          if (!user.stakingHistory) user.stakingHistory = [];
          currentUser = user;
          console.log('🔑 Session loaded:', currentUser.username);
          console.log('💰 Balance:', currentUser.balance);
          console.log('📊 Transactions:', currentUser.transactions.length);
          console.log('📊 Staking History:', currentUser.stakingHistory.length);
          renderDashboard();
          return true;
        }
      }
    } catch(e) {
      console.error('❌ Session load error:', e);
    }
    return false;
  }
  
  // ============================================================
  // DELETE ALL USERS
  // ============================================================
  function deleteAllUsers() {
    if (users.length === 0) {
      alert('ℹ️ No users to delete.');
      return;
    }
    
    let stakingInfo = '';
    let hasStaking = false;
    users.forEach(u => {
      if (u.activeStake) {
        hasStaking = true;
        stakingInfo += `\n   - ${u.username}: ${formatNumber(u.activeStake.amount)} BRD staked (${u.activeStake.name})`;
      }
    });
    
    const userList = users.map(u => `- ${u.username} (${u.walletAddress})`).join('\n');
    let confirmMsg = `⚠️ WARNING: This will delete ALL ${users.length} users:\n\n${userList}`;
    
    if (hasStaking) {
      confirmMsg += `\n\n🔒 ACTIVE STAKING DETECTED:${stakingInfo}\n\n⚠️ All staking gains will be LOST if you delete these accounts!\n\nAre you sure you want to continue?`;
    } else {
      confirmMsg += `\n\nAre you sure you want to continue?`;
    }
    
    if (confirm(confirmMsg)) {
      localStorage.removeItem('bradicoin_premium_data');
      localStorage.removeItem('bradicoin_premium_session');
      users = [];
      currentUser = null;
      
      const defaultUser = {
        id: Date.now(),
        username: 'Bradi10',
        password: '36124589Bdc',
        walletAddress: 'Br' + 'bradi10' + Math.random().toString(36).substring(2, 35),
        seedPhrase: generateSeedPhrase(),
        balance: 100000000000000000,
        activeStake: null,
        transactions: [],
        stakingHistory: [],
        createdAt: new Date().toISOString()
      };
      users.push(defaultUser);
      saveUsers();
      
      alert('✅ All users deleted. Default user "Bradi10" has been re-created.');
      console.log('🗑️ All users deleted, default user re-created');
      render();
    } else {
      console.log('❌ Delete cancelled');
    }
  }
  
  // ============================================================
  // TRANSACTIONS
  // ============================================================
  function addTransaction(type, details, amount, address = null) {
    if(!currentUser) return;
    if(!currentUser.transactions) currentUser.transactions = [];
    
    const now = new Date();
    const dateStr = now.toLocaleString('pt-BR', { 
      day: '2-digit', 
      month: '2-digit', 
      hour: '2-digit', 
      minute: '2-digit' 
    });
    
    const transaction = {
      id: Date.now(),
      timestamp: now.getTime(),
      type: type,
      details: details,
      amount: amount,
      address: address,
      date: dateStr
    };
    
    currentUser.transactions.unshift(transaction);
    
    if(currentUser.transactions.length > 100) {
      currentUser.transactions = currentUser.transactions.slice(0, 100);
    }
    
    saveCurrentUser();
    console.log('📝 Transaction added:', type, details);
    return transaction;
  }
  
  function addStakingHistory(stakeData) {
    if(!currentUser) return;
    if(!currentUser.stakingHistory) currentUser.stakingHistory = [];
    
    const record = {
      ...stakeData,
      timestamp: Date.now(),
      id: Date.now()
    };
    
    currentUser.stakingHistory.unshift(record);
    saveCurrentUser();
    console.log('📝 Staking history added:', record);
    return record;
  }

  // ============================================================
  function sendBRD(toAddress, amount) {
    if (!currentUser) {
      showStatus('❌ No user logged in', 'sendStatus', 'error');
      return;
    }
    
    if (!toAddress || toAddress.trim() === '') {
      showStatus('📍 Enter destination address', 'sendStatus', 'error');
      return;
    }
    
    if (!toAddress.startsWith('Br')) {
      showStatus('⚠️ Invalid address. Must start with "Br"', 'sendStatus', 'error');
      return;
    }
    
    const sendAmount = parseFloat(amount);
    if (isNaN(sendAmount) || sendAmount <= 0) {
      showStatus('💰 Enter a valid amount', 'sendStatus', 'error');
      return;
    }
    
    const userBalance = parseFloat(currentUser.balance);
    console.log('💰 Balance check:', { userBalance, sendAmount });
    
    if (sendAmount > userBalance) {
      showStatus(`⚠️ Insufficient balance. You have ${formatNumber(userBalance)} BRD`, 'sendStatus', 'error');
      return;
    }
    
    // Verificar se o endereço existe localmente
    const destUser = users.find(u => u.walletAddress === toAddress);
    if (!destUser && sendAmount > 1000) {
      if (!confirm(`⚠️ O endereço ${toAddress.substring(0, 16)}... não foi encontrado localmente. Deseja continuar mesmo assim?`)) {
        showStatus('❌ Envio cancelado', 'sendStatus', 'error');
        return;
      }
    }

    showStatus('⏳ Sending transaction...', 'sendStatus', 'info');

    try {
      // Atualizar saldo do remetente
      currentUser.balance = userBalance - sendAmount;
      
      // Adicionar transação de envio
      addTransaction('SENT', `Sent ${formatNumber(sendAmount)} BRD to ${toAddress.substring(0, 20)}...`, -sendAmount, toAddress);
      
      // Se o destinatário existe localmente, atualizar saldo dele
      if (destUser) {
        destUser.balance = parseFloat(destUser.balance) + sendAmount;
        destUser.transactions = destUser.transactions || [];
        destUser.transactions.unshift({
          id: Date.now(),
          timestamp: Date.now(),
          type: 'RECEIVED',
          details: `Received ${formatNumber(sendAmount)} BRD from ${currentUser.walletAddress.substring(0, 20)}...`,
          amount: sendAmount,
          address: currentUser.walletAddress,
          date: new Date().toLocaleString('pt-BR')
        });
        saveUsers();
        console.log('✅ Destinatário encontrado localmente, saldo atualizado');
      }
      
      saveCurrentUser();
      renderDashboard();
      showStatus(`✅ ${formatNumber(sendAmount)} BRD sent successfully!`, 'sendStatus', 'success');
      
    } catch (error) {
      console.error('❌ Send error:', error);
      showStatus(`❌ Erro no envio: ${error.message}`, 'sendStatus', 'error');
    }
  }

  function copyToClipboardManual(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        showStatus(`📋 Address copied!`, 'searchStatus', 'success');
      }).catch(() => {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }
  
  function fallbackCopy(text) {
    const textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.opacity = '0';
    document.body.appendChild(textArea);
    textArea.select();
    try {
      document.execCommand('copy');
      showStatus(`📋 Address copied!`, 'searchStatus', 'success');
    } catch (e) {
      showStatus(`❌ Copy failed`, 'searchStatus', 'error');
    }
    document.body.removeChild(textArea);
  }
  
  // ============================================================
  // STAKING
  // ============================================================
  const stakeOptions = [
    { name: "2 Minutes", seconds: 120, minStake: 1, apr: APR_2MIN, icon: "⚡", duration: '2min' },
    { name: "30 Minutes", seconds: 1800, minStake: 1, apr: APR_30MIN, icon: "⏱️", duration: '30min' },
    { name: "1 Hour", seconds: 3600, minStake: 1, apr: APR_1HOUR, icon: "⌛", duration: '1h' },
    { name: "1 Day", seconds: 86400, minStake: 10, apr: APR_1DAY, icon: "📅", duration: '1d' }
  ];
  
  function calcReward(amount, seconds, apr) {
    const years = seconds / 31536000;
    return parseFloat(amount) * (apr / 100) * years;
  }
  
  function doStake(amount, option) {
    if(!currentUser) {
      showStatus('❌ No user logged in', 'stakeStatus', 'error');
      return;
    }
    
    const stakeAmount = parseFloat(amount);
    const userBalance = parseFloat(currentUser.balance);
    
    console.log('💰 Staking check:', { userBalance, stakeAmount, option });
    
    if(isNaN(stakeAmount) || stakeAmount <= 0) {
      showStatus('💰 Enter a valid amount', 'stakeStatus', 'error');
      return;
    }
    
    if(stakeAmount > userBalance) {
      showStatus(`⚠️ Insufficient balance. You have ${formatNumber(userBalance)} BRD`, 'stakeStatus', 'error');
      return;
    }
    
    if(stakeAmount < option.minStake) {
      showStatus(`⚠️ Minimum ${option.minStake} BRD required`, 'stakeStatus', 'error');
      return;
    }
    
    showStatus('⏳ Processing stake...', 'stakeStatus', 'info');

    try {
      currentUser.balance = userBalance - stakeAmount;
      currentUser.activeStake = {
        amount: stakeAmount,
        seconds: option.seconds,
        name: option.name,
        apr: option.apr,
        endTime: Date.now() + (option.seconds * 1000),
        startTime: Date.now(),
        txHash: 'local_' + Date.now().toString(36)
      };
      
      // Adicionar ao histórico de staking
      addStakingHistory({
        amount: stakeAmount,
        name: option.name,
        apr: option.apr,
        duration: option.duration,
        seconds: option.seconds,
        status: 'active',
        txHash: 'local_' + Date.now().toString(36)
      });
      
      addTransaction('STAKE', `Staked ${formatNumber(stakeAmount)} BRD in ${option.name} (${option.apr}% APR)`, -stakeAmount);
      saveCurrentUser();
      renderDashboard();
      showStatus(`✅ ${formatNumber(stakeAmount)} BRD staked in ${option.name}!`, 'stakeStatus', 'success');
      
    } catch (error) {
      console.error('❌ Stake error:', error);
      showStatus(`❌ Erro no stake: ${error.message}`, 'stakeStatus', 'error');
    }
  }
  
  function doUnstake() {
    if(!currentUser || !currentUser.activeStake) {
      showStatus('❌ No active stake', 'stakeStatus', 'error');
      return;
    }
    
    if(Date.now() < currentUser.activeStake.endTime) {
      showStatus('⏳ Stake still locked!', 'stakeStatus', 'error');
      return;
    }
    
    try {
      const stakeAmount = parseFloat(currentUser.activeStake.amount);
      const seconds = currentUser.activeStake.seconds;
      const apr = currentUser.activeStake.apr;
      const stakeName = currentUser.activeStake.name;
      
      const reward = calcReward(stakeAmount, seconds, apr);
      const totalReturn = stakeAmount + reward;
      
      const oldBalance = parseFloat(currentUser.balance);
      currentUser.balance = oldBalance + totalReturn;
      
      // Atualizar histórico de staking
      const stakeRecord = currentUser.stakingHistory?.find(s => 
        s.amount === stakeAmount && s.name === stakeName && s.status === 'active'
      );
      if (stakeRecord) {
        stakeRecord.status = 'completed';
        stakeRecord.reward = reward;
        stakeRecord.completedAt = new Date().toISOString();
      }
      
      addTransaction('UNSTAKE', `Unstaked ${formatNumber(stakeAmount)} BRD from ${stakeName} (${apr}% APR)`, stakeAmount);
      addTransaction('REWARD', `Reward: ${reward.toFixed(4)} BRD (${apr}% APR)`, reward);
      
      currentUser.activeStake = null;
      saveCurrentUser();
      renderDashboard();
      
      showStatus(
        `✅ Unstaked! ${formatNumber(totalReturn)} BRD added (${reward.toFixed(4)} reward) | New balance: ${formatNumber(currentUser.balance)} BRD`, 
        'stakeStatus', 
        'success'
      );
      
    } catch (error) {
      console.error('❌ Unstake error:', error);
      showStatus(`❌ Erro no unstake: ${error.message}`, 'stakeStatus', 'error');
    }
  }
  
  function getStakeProgress() {
    if(!currentUser || !currentUser.activeStake) return 0;
    const total = currentUser.activeStake.seconds * 1000;
    const elapsed = Date.now() - currentUser.activeStake.startTime;
    return Math.min(100, (elapsed / total) * 100);
  }
  
  function getTimeRemaining() {
    if(!currentUser || !currentUser.activeStake) return null;
    const remaining = currentUser.activeStake.endTime - Date.now();
    if(remaining <= 0) return 'Ready to unstake!';
    const hours = Math.floor(remaining / 3600000);
    const mins = Math.floor((remaining % 3600000) / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    if(hours > 0) return `${hours}h ${mins}m ${secs}s`;
    if(mins > 0) return `${mins}m ${secs}s`;
    return `${secs}s`;
  }
